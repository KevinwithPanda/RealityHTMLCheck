<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">RealityCheck social preview</title>
  <desc id="desc">Turn an AI-generated HTML export into a verified passive-static publish ZIP, or an explicit working copy with exact blockers.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#181B26"/><stop offset="1" stop-color="#07080C"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#FFB000"/><stop offset="1" stop-color="#FF5C35"/></linearGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <circle cx="1125" cy="50" r="300" fill="#FF5C35" opacity=".08"/>
  <path d="M0 502h194l33-79 49 153 40-108h258" fill="none" stroke="#373C4B" stroke-width="4"/>
  <g transform="translate(92 82)">
    <rect width="104" height="104" rx="29" fill="#252936"/>
    <path d="M15 57h22l7-22 13 49 10-32h24" fill="none" stroke="#60687C" stroke-width="6" stroke-linecap="round"/>
    <path d="m27 55 17 18 37-44" fill="none" stroke="url(#accent)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="224" y="157" fill="#F7F8FB" font-family="ui-sans-serif, system-ui, sans-serif" font-size="72" font-weight="780" letter-spacing="-3">Reality<tspan fill="#FF6845">Check</tspan></text>
  <text x="92" y="280" fill="#F7F8FB" font-family="ui-sans-serif, system-ui, sans-serif" font-size="50" font-weight="780" letter-spacing="-2">Drop the AI export ZIP.</text>
  <text x="92" y="338" fill="#F7F8FB" font-family="ui-sans-serif, system-ui, sans-serif" font-size="50" font-weight="780" letter-spacing="-2">Repair only what is provable.</text>
  <text x="92" y="396" fill="#F7F8FB" font-family="ui-sans-serif, system-ui, sans-serif" font-size="50" font-weight="780" letter-spacing="-2">Publish with exact-byte proof.</text>
  <text x="96" y="455" fill="#A1A8B8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22">No upload · real browser proof · blockers stay visible.</text>
  <rect x="862" y="240" width="294" height="178" rx="25" fill="#F8F9FB"/>
  <text x="895" y="283" fill="#167154" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="800">FINAL ARCHIVE · BROWSER PROVEN</text>
  <text x="893" y="375" fill="#171923" font-family="ui-sans-serif, system-ui, sans-serif" font-size="72" font-weight="820" letter-spacing="-4">READY</text>
  <rect x="92" y="521" width="624" height="63" rx="14" fill="#030407" stroke="#343948"/>
  <text x="119" y="561" fill="#D8DCE6" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="16">CLI / ACTION · PASS → publish ZIP · FAIL → working copy.</text>
</svg>
