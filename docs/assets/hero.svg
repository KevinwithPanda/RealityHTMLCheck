<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 720" role="img" aria-labelledby="title desc">
  <title id="title">RealityCheck - check the note, expose hidden UI failures, prove the repair</title>
  <desc id="desc">A dark developer-tool hero for portable HTML note checks and evidence-based real browser repair workflows.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#161923"/>
      <stop offset="1" stop-color="#08090D"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="1" x2="1" y2="0">
      <stop stop-color="#FFB000"/>
      <stop offset="1" stop-color="#FF5C35"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1440" height="720" rx="36" fill="url(#background)"/>
  <circle cx="1270" cy="-10" r="330" fill="#FF5C35" opacity=".06"/>
  <circle cx="106" cy="702" r="280" fill="#FFB000" opacity=".04"/>
  <path d="M0 555h212l31-76 48 151 39-105h247" fill="none" stroke="#333846" stroke-width="3" opacity=".7"/>

  <g transform="translate(92 92)">
    <rect width="82" height="82" rx="22" fill="#232733"/>
    <path d="M12 45h17l6-17 9 38 8-25h20" fill="none" stroke="#596174" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="m22 43 13 14 29-34" fill="none" stroke="url(#accent)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="108" y="61" fill="#F7F8FB" font-family="ui-sans-serif, system-ui, sans-serif" font-size="48" font-weight="760" letter-spacing="-2">Reality<tspan fill="#FF6845">Check</tspan></text>
  </g>

  <text x="92" y="255" fill="#F7F8FB" font-family="ui-sans-serif, system-ui, sans-serif" font-size="54" font-weight="780" letter-spacing="-2.3">Check the note.</text>
  <text x="92" y="318" fill="#F7F8FB" font-family="ui-sans-serif, system-ui, sans-serif" font-size="54" font-weight="780" letter-spacing="-2.3">Expose hidden failures.</text>
  <text x="92" y="381" fill="#F7F8FB" font-family="ui-sans-serif, system-ui, sans-serif" font-size="54" font-weight="780" letter-spacing="-2.3">Prove the repair.</text>
  <text x="96" y="426" fill="#9DA5B7" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20">Portable HTML notes. Real browser evidence. Before/after proof.</text>

  <g transform="translate(95 462)">
    <rect width="500" height="70" rx="14" fill="#050609" stroke="#303543"/>
    <circle cx="28" cy="35" r="5" fill="#FF5C35"/>
    <text x="49" y="43" fill="#D8DCE6" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18">Use $realitycheck. Check, repair, verify.</text>
  </g>
  <g transform="translate(95 557)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700">
    <rect width="112" height="36" rx="18" fill="#222630"/><text x="22" y="24" fill="#D8DCE6">LOCAL FIRST</text>
    <rect x="124" width="150" height="36" rx="18" fill="#222630"/><text x="146" y="24" fill="#D8DCE6">EVIDENCE BASED</text>
    <rect x="286" width="112" height="36" rx="18" fill="#222630"/><text x="311" y="24" fill="#D8DCE6">NO CLOUD</text>
  </g>

  <g transform="translate(805 84)" filter="url(#shadow)">
    <rect width="535" height="552" rx="25" fill="#FCFCFD"/>
    <rect width="535" height="70" rx="25" fill="#F3F4F7"/>
    <rect y="45" width="535" height="25" fill="#F3F4F7"/>
    <circle cx="30" cy="34" r="6" fill="#FF6B57"/><circle cx="51" cy="34" r="6" fill="#FFB546"/><circle cx="72" cy="34" r="6" fill="#48C78E"/>
    <text x="103" y="41" fill="#72798A" font-family="ui-monospace, monospace" font-size="13">report.html + verification.html</text>
    <text x="36" y="116" fill="#20232D" font-family="ui-sans-serif, system-ui, sans-serif" font-size="19" font-weight="750">REALITY SCORE</text>
    <text x="36" y="202" fill="#171923" font-family="ui-sans-serif, system-ui, sans-serif" font-size="82" font-weight="800" letter-spacing="-5">78</text>
    <text x="134" y="199" fill="#9298A7" font-family="ui-sans-serif, system-ui, sans-serif" font-size="25">/100</text>
    <rect x="269" y="105" width="225" height="95" rx="15" fill="#FFF2ED"/>
    <text x="291" y="137" fill="#B23619" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="800">QUALITY GATE</text>
    <text x="291" y="170" fill="#D9411F" font-family="ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="800">2 MAJOR</text>
    <line x1="36" y1="231" x2="499" y2="231" stroke="#E4E6EC"/>
    <text x="36" y="270" fill="#6F7687" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="800">SCENARIO</text>
    <text x="420" y="270" fill="#6F7687" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="800">RESULT</text>
    <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15">
      <text x="36" y="314" fill="#252934">baseline</text><text x="421" y="314" fill="#C27A00">1 minor</text>
      <text x="36" y="356" fill="#252934">mobile-375</text><text x="421" y="356" fill="#D9411F">1 major</text>
      <text x="36" y="398" fill="#252934">long-text</text><text x="421" y="398" fill="#D9411F">1 major</text>
      <text x="36" y="440" fill="#252934">rtl-arabic</text><text x="421" y="440" fill="#C27A00">1 minor</text>
      <text x="36" y="482" fill="#252934">image-failure</text><text x="421" y="482" fill="#C27A00">1 minor</text>
      <text x="36" y="524" fill="#252934">keyboard-tab</text><text x="421" y="524" fill="#717889">low conf.</text>
    </g>
  </g>
</svg>
