name: Verify or publish release

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Safe default only verifies; publishing modes require a matching version tag and confirmation"
        required: true
        type: choice
        default: verify
        options:
          - verify
          - github-release
          - npm-publish
      confirmation:
        description: "For a publishing mode, type the exact package and version (for example: realityhtmlcheck@0.5.0)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: realityhtmlcheck-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      package-version: ${{ steps.metadata.outputs.package-version }}
      tag-name: ${{ steps.metadata.outputs.tag-name }}
      tarball-name: ${{ steps.pack.outputs.tarball-name }}
    steps:
      - name: Check out the selected ref
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install the locked dependency graph
        run: npm ci --ignore-scripts

      - name: Require an exact tag and typed confirmation before any publication
        id: metadata
        shell: bash
        env:
          RELEASE_MODE: ${{ inputs.mode }}
          RELEASE_CONFIRMATION: ${{ inputs.confirmation }}
          SELECTED_REF: ${{ github.ref }}
        run: |
          node <<'NODE'
          const { appendFileSync, readFileSync } = require("node:fs");
          const value = JSON.parse(readFileSync("package.json", "utf8"));
          const expectedName = "realityhtmlcheck";
          const expectedTag = `v${value.version}`;
          const expectedConfirmation = `${value.name}@${value.version}`;
          if (value.name !== expectedName) throw new Error(`Expected package ${expectedName}, received ${value.name}`);
          if (process.env.RELEASE_MODE !== "verify") {
            if (process.env.SELECTED_REF !== `refs/tags/${expectedTag}`) {
              throw new Error(`Select the existing ${expectedTag} tag when running a publishing mode; received ${process.env.SELECTED_REF}`);
            }
            if (process.env.RELEASE_CONFIRMATION !== expectedConfirmation) {
              throw new Error(`Confirmation must exactly equal ${expectedConfirmation}`);
            }
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `package-version=${value.version}\ntag-name=${expectedTag}\n`);
          NODE
          if test "$RELEASE_MODE" != "verify"; then
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
              echo "Publishing is restricted to a version tag whose commit is reachable from origin/main." >&2
              exit 1
            }
          fi

      - name: Run the complete test suite
        run: npm test

      - name: Prove the tarball through an isolated npx-style consumer
        run: npm run package:smoke

      - name: Build the immutable release tarball
        id: pack
        shell: bash
        run: |
          mkdir dist
          package_file="$(npm pack --silent --pack-destination dist)"
          test -f "dist/$package_file"
          npm pack --dry-run --json > dist/package-contents.json
          (
            cd dist
            sha256sum "$package_file" > SHA256SUMS
          )
          echo "tarball-name=$package_file" >> "$GITHUB_OUTPUT"

      - name: Upload the verified release candidate
        uses: actions/upload-artifact@v7
        with:
          name: realityhtmlcheck-${{ steps.metadata.outputs.package-version }}
          path: dist
          if-no-files-found: error
          retention-days: 14

  github-release:
    if: inputs.mode == 'github-release'
    needs: verify
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - name: Download the exact verified candidate
        uses: actions/download-artifact@v8
        with:
          name: realityhtmlcheck-${{ needs.verify.outputs.package-version }}
          path: dist

      - name: Verify checksum and create the GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.verify.outputs.tag-name }}
          RELEASE_VERSION: ${{ needs.verify.outputs.package-version }}
          TARBALL: ${{ needs.verify.outputs.tarball-name }}
        run: |
          cd dist
          sha256sum --check SHA256SUMS
          gh release create "$RELEASE_TAG" "$TARBALL" SHA256SUMS package-contents.json \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "RealityHTMLCheck $RELEASE_VERSION" \
            --generate-notes

  npm-publish:
    if: inputs.mode == 'npm-publish'
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/realityhtmlcheck
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Set up Node for npm trusted publishing
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Download the exact verified candidate
        uses: actions/download-artifact@v8
        with:
          name: realityhtmlcheck-${{ needs.verify.outputs.package-version }}
          path: dist

      - name: Require the same tarball in an existing GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.verify.outputs.tag-name }}
          TARBALL: ${{ needs.verify.outputs.tarball-name }}
        run: |
          mkdir released
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$TARBALL" \
            --pattern SHA256SUMS \
            --dir released
          (
            cd released
            sha256sum --check SHA256SUMS
          )
          cmp "dist/$TARBALL" "released/$TARBALL"

      - name: Publish with npm OIDC provenance
        shell: bash
        env:
          TARBALL: ${{ needs.verify.outputs.tarball-name }}
        run: |
          cd dist
          sha256sum --check SHA256SUMS
          NPM_VERSION="$(npm --version)" node -e 'const [major,minor,patch]=process.env.NPM_VERSION.split(".").map(Number); if(major<11||(major===11&&(minor<5||(minor===5&&patch<1)))) throw new Error(`npm 11.5.1 or newer is required for trusted publishing; received ${process.env.NPM_VERSION}`)'
          npm publish "$TARBALL" --access public --provenance
