            .realitycheck/ci-journey-fixed
            .realitycheck/ci-links-broken
            .realitycheck/ci-links-fixed
            .realitycheck/ci-metadata-broken
            .realitycheck/ci-metadata-fixed
            .realitycheck/ci-visual-missing
            .realitycheck/ci-visual-approved
            .realitycheck/ci-visual-regressed
