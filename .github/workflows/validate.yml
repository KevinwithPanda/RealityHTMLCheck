name: Validate skill

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install pinned browser adapter
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Compile report tooling
        run: |
          python -m py_compile realitycheck/scripts/report.py tests/test_skill.py scripts/install-skill.py
          node --check realitycheck/scripts/audit.mjs
          node --check realitycheck/scripts/demo-server.mjs
          node --check realitycheck/scripts/artifact-validator.mjs
          node --check realitycheck/scripts/config.mjs
          node --check realitycheck/scripts/site-report.mjs
          node --check realitycheck/scripts/policy-review.mjs
          node --check realitycheck/scripts/issue-drafts.mjs
          node --check realitycheck/scripts/release-decision.mjs
          node --check realitycheck/scripts/audit-plan.mjs
          node --check realitycheck/scripts/security-headers.mjs
          node --check realitycheck/scripts/note-analyzer.mjs
          node --check realitycheck/scripts/note-scope.mjs
          node --check realitycheck/scripts/note-compare.mjs
          node --check realitycheck/scripts/note-comparison-report.mjs
          node --check realitycheck/scripts/note-check.mjs
          node --check realitycheck/scripts/note-github-summary.mjs
          node --check realitycheck/scripts/action-paths.mjs

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Prove the packed CLI from an isolated consumer
        shell: bash
        run: |
          package_dir="$(mktemp -d)"
          consumer_dir="$(mktemp -d)"
          cleanup_package_smoke() {
            rm -rf "$package_dir" "$consumer_dir"
          }
          trap cleanup_package_smoke EXIT
          package_file="$(npm pack --silent --pack-destination "$package_dir")"
          package_path="$package_dir/$package_file"
          (
            cd "$consumer_dir"
            npm init --yes > /dev/null
            npm install --ignore-scripts "$package_path" > /dev/null
            cli="./node_modules/.bin/realityhtmlcheck"
            "$cli" profiles > profiles.txt
            "$cli" init --profile product --base-url http://127.0.0.1:4300/app
            "$cli" plan --config realitycheck.config.json --output audit-plan
            "$cli" validate audit-plan/audit-plan.json
            python - <<'PY'
          from pathlib import Path
          root = Path("note-fixture")
          (root / "assets").mkdir(parents=True)
          (root / "assets" / "chart.svg").write_text('<svg xmlns="http://www.w3.org/2000/svg"></svg>', encoding="utf-8")
          (root / "note.html").write_text('''<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Packed note</title></head><body><h1>Packed note</h1><p>This portable note contains enough readable content to prove the installed package checks a real folder without a server or configuration.</p><img src="assets/chart.svg" alt="Chart"></body></html>''', encoding="utf-8")
          PY
            "$cli" note note-fixture --output note-evidence --fail-on error --language en
            python - <<'PY'
          import json
          from pathlib import Path
          config = json.loads(Path("realitycheck.config.json").read_text(encoding="utf-8"))
          plan = json.loads(Path("audit-plan/audit-plan.json").read_text(encoding="utf-8"))
          assert config["$schema"] == "./node_modules/realityhtmlcheck/realitycheck/assets/config.schema.json", config
          assert Path(config["$schema"]).is_file(), config
          assert plan["target"]["url"] == "http://127.0.0.1:4300/app", plan
          assert plan["target"]["inspected"] is False, plan
          assert {item["id"] for item in plan["safety"]} >= {"preview-only", "no-submit"}, plan
          assert Path("audit-plan/audit-plan.html").is_file()
          assert Path("audit-plan/audit-plan.zh-CN.md").is_file()
          note = json.loads(Path("note-evidence/latest.json").read_text(encoding="utf-8"))
          assert note["kind"] == "html-note-check-bundle", note
          assert note["summary"]["score"] == 100, note
          assert note["privacy"] == {"uploaded": False, "absolutePathsPersisted": False}, note
          assert note["sourceModified"] is False, note
          assert Path("note-evidence/latest.html").is_file()
          profiles = Path("profiles.txt").read_text(encoding="utf-8")
          assert all(name in profiles for name in ("starter", "product", "strict")), profiles
          PY
          )

      - name: Prepare the HTML note Action fixture
        shell: bash
        run: |
          mkdir -p note-action-fixture/assets
          cat > note-action-fixture/index.html <<'HTML'
          <html><head><title>Broken portable note</title></head><body><h1>TODO: finish this note</h1><p>This intentionally broken HTML note proves that the composite Action preserves a complete report before enforcing its error gate.</p><img src="assets/missing.png"></body></html>
          HTML

      - name: Prove the HTML note Action gate and artifact handoff
        id: note-action
        continue-on-error: true
        uses: ./
        with:
          kind: note
          path: note-action-fixture
          output: .realitycheck/ci-note-action
          fail-on: error
          summary-language: en
          max-annotations: "5"
          artifact-name: realitycheck-note-action-report

      - name: Verify the HTML note Action evidence and exit code
        if: always()
        shell: bash
        env:
          RC_ACTION_OUTCOME: ${{ steps.note-action.outcome }}
          RC_ACTION_EXIT_CODE: ${{ steps.note-action.outputs.exit-code }}
          RC_ACTION_REPORT: ${{ steps.note-action.outputs.note-report-path }}
        run: |
          test "$RC_ACTION_OUTCOME" = "failure"
          test "$RC_ACTION_EXIT_CODE" = "1"
          test "$RC_ACTION_REPORT" = ".realitycheck/ci-note-action/latest.html"
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path(".realitycheck/ci-note-action")
          report = json.loads((root / "latest.json").read_text(encoding="utf-8"))
          assert report["kind"] == "html-note-check-bundle", report
          assert report["summary"]["counts"]["error"] > 0, report
          assert report["summary"]["status"] == "needs-fix", report
          assert report["privacy"] == {"uploaded": False, "absolutePathsPersisted": False}, report
          assert report["sourceModified"] is False, report
          assert (root / "latest.html").is_file()
          assert (root / "github-summary.md").is_file()
          PY

      - name: Prove the HTML note baseline does not keep known debt red
        id: note-baseline-action
        uses: ./
        with:
          kind: note
          path: note-action-fixture
          baseline: .realitycheck/ci-note-action/latest.json
          output: .realitycheck/ci-note-baseline
          fail-on: error
          summary-language: en
          max-annotations: "5"
          artifact-name: realitycheck-note-baseline-report

      - name: Verify the HTML note baseline comparison handoff
        shell: bash
        env:
          RC_ACTION_EXIT_CODE: ${{ steps.note-baseline-action.outputs.exit-code }}
          RC_COMPARISON_PATH: ${{ steps.note-baseline-action.outputs.note-comparison-path }}
          RC_COMPARISON_JSON_PATH: ${{ steps.note-baseline-action.outputs.note-comparison-json-path }}
        run: |
          test "$RC_ACTION_EXIT_CODE" = "0"
          test "$RC_COMPARISON_PATH" = ".realitycheck/ci-note-baseline/comparison.html"
          test "$RC_COMPARISON_JSON_PATH" = ".realitycheck/ci-note-baseline/comparison.json"
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path(".realitycheck/ci-note-baseline")
          comparison = json.loads((root / "comparison.json").read_text(encoding="utf-8"))
          assert comparison["counts"]["regressions"] == 0, comparison
          assert comparison["counts"]["persistent"] > 0, comparison
          assert comparison["gate"] == {
              "mode": "baseline-regressions-only",
              "failOn": "error",
              "failed": False,
              "states": ["new", "worsened", "unverified"],
          }, comparison
          assert (root / "comparison.html").is_file()
          summary = (root / "github-summary.md").read_text(encoding="utf-8")
          assert "Regression gate passed" in summary, summary
          assert "do not keep the job red" in summary, summary
          PY

      - name: Prepare the auditable HTML exclusion Action fixture
        shell: bash
        run: |
          mkdir -p note-exclusion-fixture/archive
          cat > note-exclusion-fixture/index.html <<'HTML'
          <!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Published note</title></head><body><h1>Published note</h1><p>This complete selected note proves that Action exclusions affect only per-file HTML checks.</p><a href="archive/draft.html#kept">Archived section</a></body></html>
          HTML
          cat > note-exclusion-fixture/archive/draft.html <<'HTML'
          <html><body><h1 id="kept">TODO �</h1><p>This intentionally broken archived draft remains in the package inventory.</p></body></html>
          HTML

      - name: Prove auditable HTML exclusions in the composite Action
        id: note-exclusion-action
        uses: ./
        with:
          kind: note
          path: note-exclusion-fixture
          exclude-html: |
            archive/**
          output: .realitycheck/ci-note-exclusion
          fail-on: error
          summary-language: en
          artifact-name: realitycheck-note-exclusion-report

      - name: Verify excluded HTML remains in the Action package inventory
        shell: bash
        env:
          RC_ACTION_EXIT_CODE: ${{ steps.note-exclusion-action.outputs.exit-code }}
        run: |
          test "$RC_ACTION_EXIT_CODE" = "0"
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path(".realitycheck/ci-note-exclusion")
          report = json.loads((root / "latest.json").read_text(encoding="utf-8"))
          assert report["selection"]["html"] == {
              "excludePatterns": ["archive/**"],
              "excludedFiles": ["archive/draft.html"],
              "excludedCount": 1,
          }, report
          assert report["discovery"]["htmlFiles"] == 1, report
          assert report["discovery"]["knownFiles"] == 2, report
          assert not any(item["ruleId"] == "broken-cross-document-fragment" for item in report["packageFindings"]), report
          summary = (root / "github-summary.md").read_text(encoding="utf-8")
          assert "HTML exclusions" in summary, summary
          assert "remain in the package inventory" in summary, summary
          PY

      - name: Prove the browser-free effective audit plan
        shell: bash
        run: |
          node realitycheck/scripts/audit.mjs plan \
            --config examples/audit-plan-lab/realitycheck.config.json \
            --output .realitycheck/ci-audit-plan
          node realitycheck/scripts/audit.mjs validate \
            .realitycheck/ci-audit-plan/audit-plan.json
          python - <<'PY'
          import json
          from pathlib import Path
          plan = json.loads(Path(".realitycheck/ci-audit-plan/audit-plan.json").read_text(encoding="utf-8"))
          assert plan["summary"]["pagesMax"] == 20, plan
          assert plan["summary"]["scenariosPerPage"] == 15, plan
          assert plan["summary"]["scenarioExecutionsMax"] == 301, plan
          assert plan["summary"]["enabledDetectors"] == 12, plan
          # `safety` is deliberately a bilingual, extensible list rather than a
          # boolean bag. Prove the semantic contract by ID and use the target's
          # schema-bound `inspected` flag for the browser-free guarantee.
          safety_by_id = {item["id"]: item for item in plan["safety"]}
          assert {"preview-only", "same-origin", "no-submit", "reviewed-repair"} <= safety_by_id.keys(), plan
          assert plan["target"]["inspected"] is False, plan
          assert "data-testid" not in json.dumps(plan), plan
          assert Path(".realitycheck/ci-audit-plan/audit-plan.html").is_file()
          assert Path(".realitycheck/ci-audit-plan/audit-plan.zh-CN.md").is_file()
          PY

      - name: Prove the structural policy anti-weakening gate
        shell: bash
        run: |
          set +e
          node realitycheck/scripts/audit.mjs policy-review \
            examples/policy-review-lab/before.config.json \
            examples/policy-review-lab/after-weakened.config.json \
            --output .realitycheck/ci-policy-review
          policy_status=$?
          set -e
          test "$policy_status" -eq 1
          node realitycheck/scripts/audit.mjs validate .realitycheck/ci-policy-review/policy-review.json
          node realitycheck/scripts/audit.mjs policy-review \
            examples/policy-review-lab/after-weakened.config.json \
            examples/policy-review-lab/before.config.json \
            --output .realitycheck/ci-policy-strengthening
          python - <<'PY'
          import json
          from pathlib import Path
          review = json.loads(Path(".realitycheck/ci-policy-review/policy-review.json").read_text(encoding="utf-8"))
          assert review["summary"]["gateFailed"], review
          assert review["summary"]["weakened"] >= 20, review
          serialized = json.dumps(review)
          assert "data-testid" not in serialized, serialized
          assert "/admin/" not in serialized, serialized
          assert "Tracked in WEB-410" not in serialized, serialized
          assert Path(".realitycheck/ci-policy-review/policy-review.html").is_file()
          assert Path(".realitycheck/ci-policy-review/policy-review.zh-CN.md").is_file()
          PY

      - name: Prove the non-submitting GitHub issue draft handoff
        shell: bash
        run: |
          node realitycheck/scripts/audit.mjs issue-drafts \
            examples/reference-run/repair-plan.json \
            --output .realitycheck/ci-issue-drafts
          node realitycheck/scripts/audit.mjs validate \
            .realitycheck/ci-issue-drafts/github-issue-drafts.json
          python - <<'PY'
          import json
          from pathlib import Path
          drafts = json.loads(Path(".realitycheck/ci-issue-drafts/github-issue-drafts.json").read_text(encoding="utf-8"))
          assert drafts["summary"] == {
              "drafts": 6, "occurrences": 6, "duplicates": 0,
              "actionable": 5, "review": 1, "waived": 0,
              "critical": 0, "major": 2, "minor": 4, "info": 0,
          }
          assert all(item["verification"]["requireFingerprintAbsent"] for item in drafts["drafts"])
          html = Path(".realitycheck/ci-issue-drafts/github-issue-drafts.html").read_text(encoding="utf-8")
          assert "navigator.clipboard.writeText" in html
          assert "NO AUTO-SUBMISSION" in html
          PY

      - name: Prove the conservative release decision handoff
        shell: bash
        run: |
          set +e
          node realitycheck/scripts/audit.mjs release-decision \
            examples/reference-run/report.json \
            examples/policy-review-lab/review/policy-review.json \
            examples/issue-drafts-lab/github-issue-drafts.json \
            --require audit,policy,issues \
            --max-age-hours 8760 \
            --output .realitycheck/ci-release-decision
          release_status=$?
          set -e
          test "$release_status" -eq 1
          node realitycheck/scripts/audit.mjs validate \
            .realitycheck/ci-release-decision/release-decision.json
          python - <<'PY'
          import json
          from pathlib import Path
          decision = json.loads(Path(".realitycheck/ci-release-decision/release-decision.json").read_text(encoding="utf-8"))
          assert decision["decision"] == "no-go"
          assert decision["summary"]["controls"] == 3
          assert decision["summary"]["failed"] == 2
          assert decision["policy"]["requiredControls"] == ["audit", "policy", "issues"]
          assert all("target" not in control for control in decision["controls"])
          html = Path(".realitycheck/ci-release-decision/release-decision.html").read_text(encoding="utf-8")
          assert "NO AUTOMATIC DEPLOYMENT" in html
          assert "data-language=\"zh-CN\"" in html
          PY

      - name: Prove semantic response-header failure and recovery
        shell: bash
        run: |
          lab_log="$RUNNER_TEMP/realitycheck-security-header-lab.log"
          node examples/security-header-lab/server.mjs 4193 > "$lab_log" 2>&1 &
          lab_pid=$!
          cleanup_lab() {
            status=$?
            if test "$status" -ne 0; then
              cat "$lab_log"
            fi
            kill "$lab_pid" 2>/dev/null || true
            exit "$status"
          }
          trap cleanup_lab EXIT
          # A fresh runner can reach curl before Node has bound the loopback
          # socket. Plain `--retry` does not retry connection-refused errors.
          curl --fail --silent --show-error --retry 20 --retry-delay 1 \
            --retry-connrefused http://127.0.0.1:4193/fixed > /dev/null
          set +e
          node realitycheck/scripts/audit.mjs audit \
            --config examples/security-header-lab/broken.config.json \
            --browser "$(command -v google-chrome)"
          broken_status=$?
          set -e
          test "$broken_status" -eq 1
          node realitycheck/scripts/audit.mjs audit \
            --config examples/security-header-lab/fixed.config.json \
            --browser "$(command -v google-chrome)"
          python - <<'PY'
          import json
          from pathlib import Path
          for name, score, count, total in (("broken", 80, 4, 5), ("fixed", 100, 0, 0)):
              root = Path(".realitycheck/security-header-lab") / name
              latest = json.loads((root / "latest.json").read_text(encoding="utf-8"))
              report = json.loads((root / latest["artifacts"]["json"]).read_text(encoding="utf-8"))
              semantic = [item for item in report["findings"] if item["ruleId"].startswith("security-header-policy-")]
              assert report["score"]["overall"] == score, report["score"]
              assert len(semantic) == count, semantic
              assert len(report["findings"]) == total, report["findings"]
              assert all(item["measurements"]["rawValueRetained"] is False for item in semantic)
              serialized = json.dumps(report)
              assert "default-src 'self'" not in serialized
              assert "frame-ancestors 'none'" not in serialized
              assert "private.example" not in serialized
              assert "asset.js" not in serialized
              assert "sha384-" not in serialized
              if name == "broken":
                  sri = next(item for item in report["findings"] if item["ruleId"] == "security-subresource-integrity")
                  assert sri["measurements"]["missingIntegrity"] == 1
                  assert sri["measurements"]["resourcePathsRetained"] is False
                  assert sri["measurements"]["integrityValuesRetained"] is False
          PY

      - name: Prove the zero-configuration bundled demo
        shell: bash
        run: |
          npm run demo -- --browser "$(command -v google-chrome)" --output .realitycheck/ci-demo
          demo_report="$(find .realitycheck/ci-demo -name report.json -print -quit)"
          test -n "$demo_report"
          python - "$demo_report" <<'PY'
          import json
          import sys
          from urllib.parse import urlsplit
          report = json.load(open(sys.argv[1], encoding="utf-8"))
          assert report["score"]["totalFindings"] >= 5, report
          assert report["score"]["counts"]["major"] >= 2, report
          assert report["threshold"]["met"], report
          assert urlsplit(report["target"]["requestedUrl"]).hostname == "127.0.0.1", report
          assert report["adapter"]["isolation"] == "fresh-context", report
          PY
          node realitycheck/scripts/audit.mjs validate "$demo_report"
          node realitycheck/scripts/audit.mjs github-summary .realitycheck/ci-demo \
            --output .realitycheck/ci-demo/github-summary.md \
            --max-annotations 3 \
            --language zh-CN > /tmp/realitycheck-demo-annotations.log
          python - <<'PY'
          from pathlib import Path
          summary = Path(".realitycheck/ci-demo/github-summary.md").read_text(encoding="utf-8")
          annotations = [line for line in Path("/tmp/realitycheck-demo-annotations.log").read_text(encoding="utf-8").splitlines() if line.startswith("::")]
          assert "RealityCheck 拉取请求摘要" in summary, summary
          assert "优先问题" in summary, summary
          assert len(annotations) == 3, annotations
          assert all(line.startswith(("::error", "::warning", "::notice")) for line in annotations), annotations
          PY

      - name: Prove a repair with real browser runs
        shell: bash
        run: |
          server_pid=""
          cleanup() {
            if [ -n "$server_pid" ]; then
              kill "$server_pid" 2>/dev/null || true
            fi
          }
          wait_for_demo() {
            python - <<'PY'
          import time
          import urllib.request
          for _ in range(50):
              try:
                  urllib.request.urlopen("http://127.0.0.1:4173", timeout=1)
                  break
              except Exception:
                  time.sleep(0.1)
          else:
              raise SystemExit("demo server did not start")
          PY
          }
          trap cleanup EXIT

          python -m http.server 4173 --bind 127.0.0.1 --directory examples/demo-broken >/tmp/realitycheck-demo.log 2>&1 &
          server_pid=$!
          wait_for_demo
          set +e
          npm run audit -- http://127.0.0.1:4173 \
            --browser "$(command -v google-chrome)" \
            --output .realitycheck/ci-before \
            --fail-on major
          status=$?
          set -e
          test "$status" -eq 1
          before_report="$(find .realitycheck/ci-before -name report.json -print -quit)"
          test -n "$before_report"

          cleanup
          wait "$server_pid" 2>/dev/null || true
          server_pid=""
          python -m http.server 4173 --bind 127.0.0.1 --directory examples/demo-fixed >/tmp/realitycheck-fixed.log 2>&1 &
          server_pid=$!
          wait_for_demo
          npm run audit -- http://127.0.0.1:4173 \
            --browser "$(command -v google-chrome)" \
            --output .realitycheck/ci-after \
            --compare "$before_report" \
            --fail-on major
          after_report="$(find .realitycheck/ci-after -name report.json -print -quit)"
          verification="$(find .realitycheck/ci-after -name verification.json -print -quit)"
          test -n "$after_report"
          test -n "$verification"
          test -f "$(dirname "$after_report")/screenshots/mobile-375.png"
          test -f "$(dirname "$after_report")/report.sarif"
          test -f "$(dirname "$after_report")/report.junit.xml"
          python - "$verification" <<'PY'
          import json
          import sys
          verification = json.load(open(sys.argv[1], encoding="utf-8"))
          assert verification["counts"]["resolved"] >= 6, verification
          assert verification["counts"]["remaining"] == 0, verification
          assert verification["counts"]["new"] == 0, verification
          assert verification["counts"]["unverified"] == 0, verification
          assert not verification["threshold"]["met"], verification
          PY
          node realitycheck/scripts/audit.mjs validate "$before_report" "$after_report" "$verification"

      - name: Prove the configurable responsive viewport matrix
        shell: bash
        run: |
          python -m http.server 4184 --bind 127.0.0.1 --directory examples/viewport-lab >/tmp/realitycheck-viewport.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..50}; do
            if curl --fail --silent http://127.0.0.1:4184/broken.html >/dev/null; then break; fi
            sleep 0.1
          done
          set +e
          npm run audit -- --config examples/viewport-lab/broken.config.json \
            --browser "$(command -v google-chrome)"
          broken_status=$?
          set -e
          test "$broken_status" -eq 1
          npm run audit -- --config examples/viewport-lab/fixed.config.json \
            --browser "$(command -v google-chrome)"
          broken_report="$(find .realitycheck/viewport-lab-broken -name report.json -print -quit)"
          fixed_report="$(find .realitycheck/viewport-lab-fixed -name report.json -print -quit)"
          test -n "$broken_report"
          test -n "$fixed_report"
          python - "$broken_report" "$fixed_report" <<'PY'
          import json
          import sys
          from pathlib import Path

          broken = json.load(open(sys.argv[1], encoding="utf-8"))
          fixed = json.load(open(sys.argv[2], encoding="utf-8"))
          assert broken["score"]["overall"] == 92, broken
          assert fixed["score"]["overall"] == 100, fixed
          assert len(broken["findings"]) == 1, broken
          finding = broken["findings"][0]
          assert finding["ruleId"] == "offscreen-critical-control", finding
          assert finding["scenarioId"] == "phone-320", finding
          assert finding["measurements"]["viewportWidth"] == 320, finding
          states = {item["id"]: item["status"] for item in broken["scenarios"]}
          assert states["phone-320"] == "completed-with-findings", states
          assert states["phone-390"] == "passed", states
          assert states["tablet-768"] == "passed", states
          screenshots = Path(sys.argv[1]).parent / "screenshots"
          assert all((screenshots / f"{name}.png").is_file() for name in ("phone-320", "phone-390", "tablet-768"))
          PY
          node realitycheck/scripts/audit.mjs validate "$broken_report" "$fixed_report"

      - name: Prove safe multi-page discovery and site reporting
        shell: bash
        run: |
          python -m http.server 4174 --bind 127.0.0.1 --directory . >/tmp/realitycheck-site.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..50}; do
            if curl --fail --silent http://127.0.0.1:4174/examples/showcase-site/index.html >/dev/null; then break; fi
            sleep 0.1
          done
          set +e
          npm run audit -- http://127.0.0.1:4174/examples/showcase-site/index.html \
