name: Validate skill

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install pinned browser adapter
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Compile report tooling
        run: |
          python -m py_compile realitycheck/scripts/report.py tests/test_skill.py scripts/install-skill.py
          node --check realitycheck/scripts/audit.mjs
          node --check realitycheck/scripts/demo-server.mjs
          node --check realitycheck/scripts/artifact-validator.mjs
          node --check realitycheck/scripts/config.mjs
          node --check realitycheck/scripts/site-report.mjs
          node --check realitycheck/scripts/policy-review.mjs
          node --check realitycheck/scripts/issue-drafts.mjs
          node --check realitycheck/scripts/release-decision.mjs
          node --check realitycheck/scripts/audit-plan.mjs
          node --check realitycheck/scripts/security-headers.mjs

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Prove the browser-free effective audit plan
        shell: bash
        run: |
          node realitycheck/scripts/audit.mjs plan \
            --config examples/audit-plan-lab/realitycheck.config.json \
            --output .realitycheck/ci-audit-plan
          node realitycheck/scripts/audit.mjs validate \
            .realitycheck/ci-audit-plan/audit-plan.json
          python - <<'PY'
          import json
          from pathlib import Path
          plan = json.loads(Path(".realitycheck/ci-audit-plan/audit-plan.json").read_text(encoding="utf-8"))
          assert plan["summary"]["pagesMax"] == 20, plan
          assert plan["summary"]["scenariosPerPage"] == 15, plan
          assert plan["summary"]["scenarioExecutionsMax"] == 301, plan
          assert plan["summary"]["enabledDetectors"] == 12, plan
          # `safety` is deliberately a bilingual, extensible list rather than a
          # boolean bag. Prove the semantic contract by ID and use the target's
          # schema-bound `inspected` flag for the browser-free guarantee.
          safety_by_id = {item["id"]: item for item in plan["safety"]}
          assert {"preview-only", "same-origin", "no-submit", "reviewed-repair"} <= safety_by_id.keys(), plan
          assert plan["target"]["inspected"] is False, plan
          assert "data-testid" not in json.dumps(plan), plan
          assert Path(".realitycheck/ci-audit-plan/audit-plan.html").is_file()
          assert Path(".realitycheck/ci-audit-plan/audit-plan.zh-CN.md").is_file()
          PY

      - name: Prove the structural policy anti-weakening gate
        shell: bash
        run: |
          set +e
          node realitycheck/scripts/audit.mjs policy-review \
            examples/policy-review-lab/before.config.json \
            examples/policy-review-lab/after-weakened.config.json \
            --output .realitycheck/ci-policy-review
          policy_status=$?
          set -e
          test "$policy_status" -eq 1
          node realitycheck/scripts/audit.mjs validate .realitycheck/ci-policy-review/policy-review.json
          node realitycheck/scripts/audit.mjs policy-review \
            examples/policy-review-lab/after-weakened.config.json \
            examples/policy-review-lab/before.config.json \
            --output .realitycheck/ci-policy-strengthening
          python - <<'PY'
          import json
          from pathlib import Path
          review = json.loads(Path(".realitycheck/ci-policy-review/policy-review.json").read_text(encoding="utf-8"))
          assert review["summary"]["gateFailed"], review
          assert review["summary"]["weakened"] >= 20, review
          serialized = json.dumps(review)
          assert "data-testid" not in serialized, serialized
          assert "/admin/" not in serialized, serialized
          assert "Tracked in WEB-410" not in serialized, serialized
          assert Path(".realitycheck/ci-policy-review/policy-review.html").is_file()
          assert Path(".realitycheck/ci-policy-review/policy-review.zh-CN.md").is_file()
          PY

      - name: Prove the non-submitting GitHub issue draft handoff
        shell: bash
        run: |
          node realitycheck/scripts/audit.mjs issue-drafts \
            examples/reference-run/repair-plan.json \
            --output .realitycheck/ci-issue-drafts
          node realitycheck/scripts/audit.mjs validate \
            .realitycheck/ci-issue-drafts/github-issue-drafts.json
          python - <<'PY'
          import json
          from pathlib import Path
          drafts = json.loads(Path(".realitycheck/ci-issue-drafts/github-issue-drafts.json").read_text(encoding="utf-8"))
          assert drafts["summary"] == {
              "drafts": 6, "occurrences": 6, "duplicates": 0,
              "actionable": 5, "review": 1, "waived": 0,
              "critical": 0, "major": 2, "minor": 4, "info": 0,
          }
          assert all(item["verification"]["requireFingerprintAbsent"] for item in drafts["drafts"])
          html = Path(".realitycheck/ci-issue-drafts/github-issue-drafts.html").read_text(encoding="utf-8")
          assert "navigator.clipboard.writeText" in html
          assert "NO AUTO-SUBMISSION" in html
          PY

      - name: Prove the conservative release decision handoff
        shell: bash
        run: |
          set +e
          node realitycheck/scripts/audit.mjs release-decision \
            examples/reference-run/report.json \
            examples/policy-review-lab/review/policy-review.json \
            examples/issue-drafts-lab/github-issue-drafts.json \
            --require audit,policy,issues \
            --max-age-hours 8760 \
            --output .realitycheck/ci-release-decision
          release_status=$?
          set -e
          test "$release_status" -eq 1
          node realitycheck/scripts/audit.mjs validate \
            .realitycheck/ci-release-decision/release-decision.json
          python - <<'PY'
          import json
          from pathlib import Path
          decision = json.loads(Path(".realitycheck/ci-release-decision/release-decision.json").read_text(encoding="utf-8"))
          assert decision["decision"] == "no-go"
          assert decision["summary"]["controls"] == 3
          assert decision["summary"]["failed"] == 2
          assert decision["policy"]["requiredControls"] == ["audit", "policy", "issues"]
          assert all("target" not in control for control in decision["controls"])
          html = Path(".realitycheck/ci-release-decision/release-decision.html").read_text(encoding="utf-8")
          assert "NO AUTOMATIC DEPLOYMENT" in html
          assert "data-language=\"zh-CN\"" in html
          PY

      - name: Prove semantic response-header failure and recovery
        shell: bash
        run: |
          lab_log="$RUNNER_TEMP/realitycheck-security-header-lab.log"
          node examples/security-header-lab/server.mjs 4193 > "$lab_log" 2>&1 &
          lab_pid=$!
          cleanup_lab() {
            status=$?
            if test "$status" -ne 0; then
              cat "$lab_log"
            fi
            kill "$lab_pid" 2>/dev/null || true
            exit "$status"
          }
          trap cleanup_lab EXIT
          # A fresh runner can reach curl before Node has bound the loopback
          # socket. Plain `--retry` does not retry connection-refused errors.
          curl --fail --silent --show-error --retry 20 --retry-delay 1 \
            --retry-connrefused http://127.0.0.1:4193/fixed > /dev/null
          set +e
          node realitycheck/scripts/audit.mjs audit \
            --config examples/security-header-lab/broken.config.json \
            --browser "$(command -v google-chrome)"
          broken_status=$?
          set -e
          test "$broken_status" -eq 1
          node realitycheck/scripts/audit.mjs audit \
            --config examples/security-header-lab/fixed.config.json \
            --browser "$(command -v google-chrome)"
          python - <<'PY'
          import json
          from pathlib import Path
          for name, score, count, total in (("broken", 80, 4, 5), ("fixed", 100, 0, 0)):
              root = Path(".realitycheck/security-header-lab") / name
              latest = json.loads((root / "latest.json").read_text(encoding="utf-8"))
              report = json.loads((root / latest["artifacts"]["json"]).read_text(encoding="utf-8"))
              semantic = [item for item in report["findings"] if item["ruleId"].startswith("security-header-policy-")]
              assert report["score"]["overall"] == score, report["score"]
              assert len(semantic) == count, semantic
              assert len(report["findings"]) == total, report["findings"]
              assert all(item["measurements"]["rawValueRetained"] is False for item in semantic)
              serialized = json.dumps(report)
              assert "default-src 'self'" not in serialized
              assert "frame-ancestors 'none'" not in serialized
              assert "private.example" not in serialized
              assert "asset.js" not in serialized
              assert "sha384-" not in serialized
              if name == "broken":
                  sri = next(item for item in report["findings"] if item["ruleId"] == "security-subresource-integrity")
                  assert sri["measurements"]["missingIntegrity"] == 1
                  assert sri["measurements"]["resourcePathsRetained"] is False
                  assert sri["measurements"]["integrityValuesRetained"] is False
          PY

      - name: Prove the zero-configuration bundled demo
        shell: bash
        run: |
          npm run demo -- --browser "$(command -v google-chrome)" --output .realitycheck/ci-demo
          demo_report="$(find .realitycheck/ci-demo -name report.json -print -quit)"
          test -n "$demo_report"
          python - "$demo_report" <<'PY'
          import json
          import sys
          from urllib.parse import urlsplit
          report = json.load(open(sys.argv[1], encoding="utf-8"))
          assert report["score"]["totalFindings"] >= 5, report
          assert report["score"]["counts"]["major"] >= 2, report
          assert report["threshold"]["met"], report
          assert urlsplit(report["target"]["requestedUrl"]).hostname == "127.0.0.1", report
          assert report["adapter"]["isolation"] == "fresh-context", report
          PY
          node realitycheck/scripts/audit.mjs validate "$demo_report"
          node realitycheck/scripts/audit.mjs github-summary .realitycheck/ci-demo \
            --output .realitycheck/ci-demo/github-summary.md \
            --max-annotations 3 \
            --language zh-CN > /tmp/realitycheck-demo-annotations.log
          python - <<'PY'
          from pathlib import Path
          summary = Path(".realitycheck/ci-demo/github-summary.md").read_text(encoding="utf-8")
          annotations = [line for line in Path("/tmp/realitycheck-demo-annotations.log").read_text(encoding="utf-8").splitlines() if line.startswith("::")]
          assert "RealityCheck 拉取请求摘要" in summary, summary
          assert "优先问题" in summary, summary
          assert len(annotations) == 3, annotations
          assert all(line.startswith(("::error", "::warning", "::notice")) for line in annotations), annotations
          PY

      - name: Prove a repair with real browser runs
        shell: bash
        run: |
          server_pid=""
          cleanup() {
            if [ -n "$server_pid" ]; then
              kill "$server_pid" 2>/dev/null || true
            fi
          }
          wait_for_demo() {
            python - <<'PY'
          import time
          import urllib.request
          for _ in range(50):
              try:
                  urllib.request.urlopen("http://127.0.0.1:4173", timeout=1)
                  break
              except Exception:
                  time.sleep(0.1)
          else:
              raise SystemExit("demo server did not start")
          PY
          }
          trap cleanup EXIT

          python -m http.server 4173 --bind 127.0.0.1 --directory examples/demo-broken >/tmp/realitycheck-demo.log 2>&1 &
          server_pid=$!
          wait_for_demo
          set +e
          npm run audit -- http://127.0.0.1:4173 \
            --browser "$(command -v google-chrome)" \
            --output .realitycheck/ci-before \
            --fail-on major
          status=$?
          set -e
          test "$status" -eq 1
          before_report="$(find .realitycheck/ci-before -name report.json -print -quit)"
          test -n "$before_report"

          cleanup
          wait "$server_pid" 2>/dev/null || true
          server_pid=""
          python -m http.server 4173 --bind 127.0.0.1 --directory examples/demo-fixed >/tmp/realitycheck-fixed.log 2>&1 &
          server_pid=$!
          wait_for_demo
          npm run audit -- http://127.0.0.1:4173 \
            --browser "$(command -v google-chrome)" \
            --output .realitycheck/ci-after \
            --compare "$before_report" \
            --fail-on major
          after_report="$(find .realitycheck/ci-after -name report.json -print -quit)"
          verification="$(find .realitycheck/ci-after -name verification.json -print -quit)"
          test -n "$after_report"
          test -n "$verification"
          test -f "$(dirname "$after_report")/screenshots/mobile-375.png"
          test -f "$(dirname "$after_report")/report.sarif"
          test -f "$(dirname "$after_report")/report.junit.xml"
          python - "$verification" <<'PY'
          import json
          import sys
          verification = json.load(open(sys.argv[1], encoding="utf-8"))
          assert verification["counts"]["resolved"] >= 6, verification
          assert verification["counts"]["remaining"] == 0, verification
          assert verification["counts"]["new"] == 0, verification
          assert verification["counts"]["unverified"] == 0, verification
          assert not verification["threshold"]["met"], verification
          PY
          node realitycheck/scripts/audit.mjs validate "$before_report" "$after_report" "$verification"

      - name: Prove the configurable responsive viewport matrix
        shell: bash
        run: |
          python -m http.server 4184 --bind 127.0.0.1 --directory examples/viewport-lab >/tmp/realitycheck-viewport.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..50}; do
            if curl --fail --silent http://127.0.0.1:4184/broken.html >/dev/null; then break; fi
            sleep 0.1
          done
          set +e
          npm run audit -- --config examples/viewport-lab/broken.config.json \
            --browser "$(command -v google-chrome)"
          broken_status=$?
          set -e
          test "$broken_status" -eq 1
          npm run audit -- --config examples/viewport-lab/fixed.config.json \
            --browser "$(command -v google-chrome)"
          broken_report="$(find .realitycheck/viewport-lab-broken -name report.json -print -quit)"
          fixed_report="$(find .realitycheck/viewport-lab-fixed -name report.json -print -quit)"
          test -n "$broken_report"
          test -n "$fixed_report"
          python - "$broken_report" "$fixed_report" <<'PY'
          import json
          import sys
          from pathlib import Path

          broken = json.load(open(sys.argv[1], encoding="utf-8"))
          fixed = json.load(open(sys.argv[2], encoding="utf-8"))
          assert broken["score"]["overall"] == 92, broken
          assert fixed["score"]["overall"] == 100, fixed
          assert len(broken["findings"]) == 1, broken
          finding = broken["findings"][0]
          assert finding["ruleId"] == "offscreen-critical-control", finding
          assert finding["scenarioId"] == "phone-320", finding
          assert finding["measurements"]["viewportWidth"] == 320, finding
          states = {item["id"]: item["status"] for item in broken["scenarios"]}
          assert states["phone-320"] == "completed-with-findings", states
          assert states["phone-390"] == "passed", states
          assert states["tablet-768"] == "passed", states
          screenshots = Path(sys.argv[1]).parent / "screenshots"
          assert all((screenshots / f"{name}.png").is_file() for name in ("phone-320", "phone-390", "tablet-768"))
          PY
          node realitycheck/scripts/audit.mjs validate "$broken_report" "$fixed_report"

      - name: Prove safe multi-page discovery and site reporting
        shell: bash
        run: |
          python -m http.server 4174 --bind 127.0.0.1 --directory . >/tmp/realitycheck-site.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..50}; do
            if curl --fail --silent http://127.0.0.1:4174/examples/showcase-site/index.html >/dev/null; then break; fi
            sleep 0.1
          done
          set +e
          npm run audit -- http://127.0.0.1:4174/examples/showcase-site/index.html \
            --config examples/showcase-site/realitycheck.config.json \
            --browser "$(command -v google-chrome)" \
            --output .realitycheck/ci-site \
            --fail-on major
          status=$?
          set -e
          test "$status" -eq 1
          site_report="$(find .realitycheck/ci-site -name site-report.json -print -quit)"
          test -n "$site_report"
          python - "$site_report" <<'PY'
          import json
          import sys
          site = json.load(open(sys.argv[1], encoding="utf-8"))
          assert site["summary"]["pagesCompleted"] == 4, site
          assert site["summary"]["pagesFailed"] == 0, site
          assert site["summary"]["gateFailed"], site
          assert not any("logout" in page["url"] for page in site["pages"]), site
          PY
          node realitycheck/scripts/audit.mjs validate "$site_report"

      - name: Prove deep resilience detectors with positive and negative fixtures
        shell: bash
        run: |
          python -m http.server 4176 --bind 127.0.0.1 --directory . >/tmp/realitycheck-lab.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..50}; do
            if curl --fail --silent http://127.0.0.1:4176/examples/scenario-lab/broken.html >/dev/null; then break; fi
            sleep 0.1
          done
          set +e
          npm run audit -- http://127.0.0.1:4176/examples/scenario-lab/broken.html \
            --mode deep \
            --browser "$(command -v google-chrome)" \
            --output .realitycheck/ci-lab-broken \
            --fail-on major
          broken_status=$?
          set -e
          test "$broken_status" -eq 1
          npm run audit -- http://127.0.0.1:4176/examples/scenario-lab/fixed.html \
            --mode deep \
            --browser "$(command -v google-chrome)" \
            --output .realitycheck/ci-lab-fixed \
            --fail-on major
          broken_report="$(find .realitycheck/ci-lab-broken -name report.json -print -quit)"
          fixed_report="$(find .realitycheck/ci-lab-fixed -name report.json -print -quit)"
          python - "$broken_report" "$fixed_report" <<'PY'
          import json
          import sys
          broken = json.load(open(sys.argv[1], encoding="utf-8"))
          fixed = json.load(open(sys.argv[2], encoding="utf-8"))
          rules = {finding["ruleId"] for finding in broken["findings"]}
          expected = {
              "reduced-motion-persistent-animation",
              "dark-scheme-low-contrast",
              "missing-api-error-feedback",
              "missing-empty-state",
          }
          assert expected <= rules, (expected - rules, broken)
          assert fixed["score"]["overall"] == 100, fixed
          assert not fixed["findings"], fixed
          PY
          node realitycheck/scripts/audit.mjs validate "$broken_report" "$fixed_report"

      - name: Prove safe keyboard journeys and URL assertions with paired fixtures
        shell: bash
        run: |
          python -m http.server 4179 --bind 127.0.0.1 --directory . >/tmp/realitycheck-journeys.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..50}; do
            if curl --fail --silent http://127.0.0.1:4179/examples/journey-lab/broken.html >/dev/null; then break; fi
            sleep 0.1
          done
          set +e
          npm run audit -- http://127.0.0.1:4179/examples/journey-lab/broken.html \
            --config examples/journey-lab/broken.config.json \
            --browser "$(command -v google-chrome)" \
            --output .realitycheck/ci-journey-broken \
            --fail-on major
          broken_status=$?
          set -e
          test "$broken_status" -eq 1
          npm run audit -- http://127.0.0.1:4179/examples/journey-lab/index.html \
            --config examples/journey-lab/realitycheck.config.json \
            --browser "$(command -v google-chrome)" \
            --output .realitycheck/ci-journey-fixed \
            --fail-on major
          broken_report="$(find .realitycheck/ci-journey-broken -name report.json -print -quit)"
          fixed_report="$(find .realitycheck/ci-journey-fixed -name report.json -print -quit)"
          python - "$broken_report" "$fixed_report" <<'PY'
          import json
          import sys
          broken = json.load(open(sys.argv[1], encoding="utf-8"))
          fixed = json.load(open(sys.argv[2], encoding="utf-8"))
          assert {finding["ruleId"] for finding in broken["findings"]} == {"journey-settings-notifications"}, broken
          trace = broken["findings"][0]["evidence"][0]["steps"]
          assert len(trace) == 2, trace
          assert trace[0]["action"] == "press" and trace[0]["keyboardInput"] == "ArrowRight", trace
          assert trace[1]["action"] == "assert" and not trace[1]["passed"] and trace[1]["count"] == 0, trace
          journey = next(item for item in fixed["scenarios"] if item["id"] == "journey-settings-notifications")
          assert journey["status"] == "passed", journey
          assert fixed["score"]["overall"] == 100 and not fixed["findings"], fixed
          PY
          node realitycheck/scripts/audit.mjs validate "$broken_report" "$fixed_report"

      - name: Prove HEAD-only link integrity with positive and negative fixtures
        shell: bash
        run: |
          python -m http.server 4178 --bind 127.0.0.1 --directory . >/tmp/realitycheck-links.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..50}; do
            if curl --fail --silent http://127.0.0.1:4178/examples/link-lab/broken.html >/dev/null; then break; fi
            sleep 0.1
          done
          set +e
          npm run audit -- http://127.0.0.1:4178/examples/link-lab/broken.html \
            --config examples/link-lab/broken.config.json \
            --browser "$(command -v google-chrome)" \
            --output .realitycheck/ci-links-broken \
            --fail-on major
          broken_status=$?
          set -e
          test "$broken_status" -eq 1
          npm run audit -- http://127.0.0.1:4178/examples/link-lab/fixed.html \
            --config examples/link-lab/fixed.config.json \
            --browser "$(command -v google-chrome)" \
            --output .realitycheck/ci-links-fixed \
            --fail-on major
          broken_report="$(find .realitycheck/ci-links-broken -name report.json -print -quit)"
          fixed_report="$(find .realitycheck/ci-links-fixed -name report.json -print -quit)"
          python - "$broken_report" "$fixed_report" <<'PY'
          import json
          import sys
          broken = json.load(open(sys.argv[1], encoding="utf-8"))
          fixed = json.load(open(sys.argv[2], encoding="utf-8"))
          assert {finding["ruleId"] for finding in broken["findings"]} == {"link-integrity-failure-budget"}, broken
          finding = broken["findings"][0]
          assert finding["measurements"]["checked"] == 2, finding
          assert finding["measurements"]["failures"] == 1, finding
          assert finding["measurements"]["excluded"] == 1, finding
          sample = finding["evidence"][0]["failureSamples"][0]
          assert sample["status"] == 404 and "?" not in sample["url"], sample
          assert fixed["score"]["overall"] == 100 and not fixed["findings"], fixed
          PY
          node realitycheck/scripts/audit.mjs validate "$broken_report" "$fixed_report"

      - name: Prove publishing metadata policy without retaining page copy
        shell: bash
        run: |
          python -m http.server 4180 --bind 127.0.0.1 --directory . >/tmp/realitycheck-metadata.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..50}; do
            if curl --fail --silent http://127.0.0.1:4180/examples/metadata-lab/broken.html >/dev/null; then break; fi
            sleep 0.1
          done
          set +e
          npm run audit -- http://127.0.0.1:4180/examples/metadata-lab/broken.html \
            --config examples/metadata-lab/broken.config.json \
            --browser "$(command -v google-chrome)" \
            --output .realitycheck/ci-metadata-broken \
            --fail-on major
          broken_status=$?
          set -e
          test "$broken_status" -eq 1
          npm run audit -- http://127.0.0.1:4180/examples/metadata-lab/fixed.html \
            --config examples/metadata-lab/fixed.config.json \
            --browser "$(command -v google-chrome)" \
            --output .realitycheck/ci-metadata-fixed \
            --fail-on major
          broken_report="$(find .realitycheck/ci-metadata-broken -name report.json -print -quit)"
          fixed_report="$(find .realitycheck/ci-metadata-fixed -name report.json -print -quit)"
          python - "$broken_report" "$fixed_report" <<'PY'
          import json
          import sys
          broken = json.load(open(sys.argv[1], encoding="utf-8"))
          fixed = json.load(open(sys.argv[2], encoding="utf-8"))
          expected = {
              "document-language-missing",
              "metadata-title-length",
              "metadata-description-length",
              "metadata-canonical",
              "metadata-viewport",
              "metadata-robots-noindex",
              "metadata-h1-count",
          }
          assert {finding["ruleId"] for finding in broken["findings"]} == expected, broken
          metadata_findings = [finding for finding in broken["findings"] if finding["ruleId"].startswith("metadata-")]
          for finding in metadata_findings:
              detector = finding["evidence"][0]
              serialized = json.dumps(detector, sort_keys=True)
              assert detector["type"] == "metadata-policy", detector
              assert "content" not in detector and "titleText" not in detector and "descriptionText" not in detector, detector
              assert "?" not in serialized and "#" not in serialized, detector
          assert broken["score"]["overall"] == 75, broken
          assert fixed["score"]["overall"] == 100 and not fixed["findings"], fixed
          PY
          node realitycheck/scripts/audit.mjs validate "$broken_report" "$fixed_report"

      - name: Prove explicitly approved visual regression baselines
        shell: bash
        run: |
          python -m http.server 4181 --bind 127.0.0.1 --directory examples/visual-regression-lab/approved >/tmp/realitycheck-visual-approved.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..50}; do
            if curl --fail --silent http://127.0.0.1:4181/index.html >/dev/null; then break; fi
            sleep 0.1
          done
          set +e
          npm run audit -- http://127.0.0.1:4181/index.html \
            --config examples/visual-regression-lab/ci.config.json \
            --browser "$(command -v google-chrome)" \
            --output .realitycheck/ci-visual-missing \
            --fail-on major
          missing_status=$?
          set -e
          test "$missing_status" -eq 1
          missing_report="$(find .realitycheck/ci-visual-missing -name report.json -print -quit)"
          node realitycheck/scripts/audit.mjs visual-approve "$missing_report" --config examples/visual-regression-lab/ci.config.json
          npm run audit -- http://127.0.0.1:4181/index.html \
            --config examples/visual-regression-lab/ci.config.json \
            --browser "$(command -v google-chrome)" \
            --output .realitycheck/ci-visual-approved \
            --fail-on major
          kill "$server_pid"
          wait "$server_pid" 2>/dev/null || true
          python -m http.server 4181 --bind 127.0.0.1 --directory examples/visual-regression-lab/regressed >/tmp/realitycheck-visual-regressed.log 2>&1 &
          server_pid=$!
          for attempt in {1..50}; do
            if curl --fail --silent http://127.0.0.1:4181/index.html >/dev/null; then break; fi
            sleep 0.1
          done
          set +e
          npm run audit -- http://127.0.0.1:4181/index.html \
            --config examples/visual-regression-lab/ci.config.json \
            --browser "$(command -v google-chrome)" \
            --output .realitycheck/ci-visual-regressed \
            --fail-on major
          regressed_status=$?
          set -e
          test "$regressed_status" -eq 1
          approved_report="$(find .realitycheck/ci-visual-approved -name report.json -print -quit)"
          regressed_report="$(find .realitycheck/ci-visual-regressed -name report.json -print -quit)"
          set +e
          node realitycheck/scripts/audit.mjs visual-approve "$regressed_report" --config examples/visual-regression-lab/ci.config.json >/tmp/realitycheck-visual-refusal.log 2>&1
          approval_status=$?
          set -e
          test "$approval_status" -eq 2
          python - "$missing_report" "$approved_report" "$regressed_report" <<'PY'
          import json
          import pathlib
          import sys
          missing = json.load(open(sys.argv[1], encoding="utf-8"))
          approved = json.load(open(sys.argv[2], encoding="utf-8"))
          regressed = json.load(open(sys.argv[3], encoding="utf-8"))
          assert {finding["ruleId"] for finding in missing["findings"]} == {"visual-baseline-missing"}, missing
          assert approved["score"]["overall"] == 100 and not approved["findings"], approved
          assert any("passed state" in warning for warning in approved["warnings"]), approved["warnings"]
          assert {finding["ruleId"] for finding in regressed["findings"]} == {"visual-regression-threshold"}, regressed
          finding = regressed["findings"][0]
          measurements = finding["measurements"]
          assert measurements["dimensionsMatch"] and measurements["maskedSelectors"] == 1, measurements
          assert measurements["changedPixels"] > 0 and measurements["diffRatio"] > measurements["maxDiffRatio"], measurements
          expected = {
              "screenshots/visual-current.png",
              "screenshots/visual-approved.png",
              "screenshots/visual-diff.png",
          }
          assert finding["evidence"][0]["type"] == "visual-policy" and finding["evidence"][0]["state"] == "failed", finding
          assert {item["path"] for item in finding["evidence"] if "path" in item} == expected, finding
          root = pathlib.Path(sys.argv[3]).parent
          assert all((root / path).is_file() for path in expected), expected
          PY
          node realitycheck/scripts/audit.mjs validate "$missing_report" "$approved_report" "$regressed_report"

      - name: Prove authenticated auditing without storage-state leakage
        shell: bash
        run: |
          python -m http.server 4177 --bind 127.0.0.1 --directory . >/tmp/realitycheck-auth.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..50}; do
            if curl --fail --silent http://127.0.0.1:4177/examples/authenticated-app/index.html >/dev/null; then break; fi
            sleep 0.1
          done
          state_path="$RUNNER_TEMP/realitycheck-fixture-state.json"
          node examples/authenticated-app/write-fixture-state.mjs http://127.0.0.1:4177 "$state_path"
          set +e
          npm run audit -- http://127.0.0.1:4177/examples/authenticated-app/index.html \
            --config examples/authenticated-app/realitycheck.config.json \
            --browser "$(command -v google-chrome)" \
            --output .realitycheck/ci-auth-anonymous \
            --fail-on major
          anonymous_status=$?
          set -e
          test "$anonymous_status" -eq 1
          npm run audit -- http://127.0.0.1:4177/examples/authenticated-app/index.html \
            --config examples/authenticated-app/realitycheck.config.json \
            --storage-state "$state_path" \
            --browser "$(command -v google-chrome)" \
            --output .realitycheck/ci-authenticated \
            --fail-on major
          anonymous_report="$(find .realitycheck/ci-auth-anonymous -name report.json -print -quit)"
          authenticated_report="$(find .realitycheck/ci-authenticated -name report.json -print -quit)"
          python - "$anonymous_report" "$authenticated_report" "$state_path" <<'PY'
          import json
          import pathlib
          import sys
          anonymous = json.load(open(sys.argv[1], encoding="utf-8"))
          authenticated = json.load(open(sys.argv[2], encoding="utf-8"))
          assert {finding["ruleId"] for finding in anonymous["findings"]} == {"custom-admin-panel-visible"}, anonymous
          assert authenticated["score"]["overall"] == 100, authenticated
          assert not authenticated["findings"], authenticated
          serialized = pathlib.Path(sys.argv[2]).read_text(encoding="utf-8")
          state = pathlib.Path(sys.argv[3]).read_text(encoding="utf-8")
          assert sys.argv[3] not in serialized
          assert "fixture-authenticated" in state and "fixture-authenticated" not in serialized
          PY
          node realitycheck/scripts/audit.mjs validate "$anonymous_report" "$authenticated_report"
          set +e
          npm run audit -- http://127.0.0.1:4177/examples/accessibility-lab/broken.html \
            --browser "$(command -v google-chrome)" \
            --output .realitycheck/ci-accessibility-broken \
            --fail-on major
          accessibility_status=$?
          set -e
          test "$accessibility_status" -eq 1
          npm run audit -- http://127.0.0.1:4177/examples/accessibility-lab/fixed.html \
            --browser "$(command -v google-chrome)" \
            --output .realitycheck/ci-accessibility-fixed \
            --fail-on major
          accessibility_broken="$(find .realitycheck/ci-accessibility-broken -name report.json -print -quit)"
          accessibility_fixed="$(find .realitycheck/ci-accessibility-fixed -name report.json -print -quit)"
          python - "$accessibility_broken" "$accessibility_fixed" <<'PY'
          import json
          import sys
          broken = json.load(open(sys.argv[1], encoding="utf-8"))
          fixed = json.load(open(sys.argv[2], encoding="utf-8"))
          expected = {
              "control-accessible-name",
              "document-language-missing",
              "document-title-missing",
              "duplicate-element-id",
              "heading-level-skip",
          }
          assert {finding["ruleId"] for finding in broken["findings"]} == expected, broken
          assert fixed["score"]["overall"] == 100 and not fixed["findings"], fixed
          PY
          node realitycheck/scripts/audit.mjs validate "$accessibility_broken" "$accessibility_fixed"
          set +e
          npm run audit -- http://127.0.0.1:4177/examples/waiver-lab/index.html --config examples/waiver-lab/unwaived.config.json \
            --browser "$(command -v google-chrome)" \
            --output .realitycheck/ci-waiver-unwaived \
            --fail-on major
          waiver_unwaived_status=$?
          set -e
          test "$waiver_unwaived_status" -eq 1
          npm run audit -- http://127.0.0.1:4177/examples/waiver-lab/index.html --config examples/waiver-lab/realitycheck.config.json \
            --browser "$(command -v google-chrome)" \
            --output .realitycheck/ci-waiver-governed \
            --fail-on major
          waiver_unwaived="$(find .realitycheck/ci-waiver-unwaived -name report.json -print -quit)"
          waiver_governed="$(find .realitycheck/ci-waiver-governed -name report.json -print -quit)"
          python - "$waiver_unwaived" "$waiver_governed" <<'PY'
          import json
          import sys
          unwaived = json.load(open(sys.argv[1], encoding="utf-8"))
          governed = json.load(open(sys.argv[2], encoding="utf-8"))
          assert unwaived["findings"][0]["ruleId"] == "custom-legacy-export-visible", unwaived
          assert unwaived["score"]["overall"] == 96 and unwaived["threshold"]["met"], unwaived
          assert governed["findings"][0]["fingerprint"] == unwaived["findings"][0]["fingerprint"], governed
          assert governed["findings"][0]["waiver"]["id"] == "legacy-export-web-42", governed
          assert governed["score"]["overall"] == 100 and governed["score"]["waivedFindings"] == 1, governed
          assert not governed["threshold"]["met"], governed
          PY
          node realitycheck/scripts/audit.mjs validate "$waiver_unwaived" "$waiver_governed"
          node realitycheck/scripts/audit.mjs validate examples/waiver-lab/unwaived.config.json examples/waiver-lab/realitycheck.config.json

      - name: Validate reference report
        run: python realitycheck/scripts/report.py validate examples/reference-run/report.json --fail-on critical

      - name: Verify the major quality gate
        shell: bash
        run: |
          set +e
          python realitycheck/scripts/report.py validate examples/reference-run/report.json --fail-on major
          status=$?
          set -e
          test "$status" -eq 1

