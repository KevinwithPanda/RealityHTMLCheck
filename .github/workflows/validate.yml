  reproduce-real-pandoc-exports:
    name: Reproduce real Pandoc exports
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Download the pinned official Pandoc archive and verify it
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "pandoc-3.8.2.1-windows-x86_64.zip"
          $expanded = Join-Path $env:RUNNER_TEMP "pandoc-3.8.2.1"
          Invoke-WebRequest -Uri "https://github.com/jgm/pandoc/releases/download/3.8.2.1/pandoc-3.8.2.1-windows-x86_64.zip" -OutFile $archive
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = "ded73890567ae71b945c8b36b8b33f89b5ed7357a9156a233445b46f92a5bc82"
          if ($actual -ne $expected) { throw "Pandoc archive SHA-256 mismatch: $actual" }
          Expand-Archive -LiteralPath $archive -DestinationPath $expanded
          $pandoc = Get-ChildItem -LiteralPath $expanded -Filter pandoc.exe -File -Recurse | Select-Object -First 1
          if (-not $pandoc) { throw "Pinned Pandoc archive did not contain pandoc.exe" }
          "PANDOC_EXE=$($pandoc.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Require every checked-in real export to reproduce byte for byte
        shell: pwsh
        run: node scripts/real-export-evidence.mjs --reproduce --pandoc "$env:PANDOC_EXE"

  note-action-no-install:
    name: HTML note Action without repository dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Prepare a nested HTML note fixture
        shell: bash
        run: |
          mkdir -p sample-project/notes/assets
          cat > sample-project/notes/index.html <<'HTML'
          <html><head><title>Nested Action note</title></head><body><h1>TODO: nested note</h1><p>This intentionally incomplete note proves the Action runs directly from a checkout without installing repository dependencies.</p><img src="assets/missing.png"></body></html>
          HTML
          test ! -d node_modules

      - name: Run the note gate without npm install
        id: note-action
        continue-on-error: true
        uses: ./
        with:
          kind: note
          working-directory: sample-project
          path: notes
          output: .realitycheck/note-action
          fail-on: error
          summary-language: en
          artifact-name: realitycheck-note-no-install

      - name: Download the uploaded note evidence
        if: always()
        uses: actions/download-artifact@v8
        with:
          name: realitycheck-note-no-install
          path: downloaded-note-evidence

      - name: Verify the isolated Action and artifact round trip
        if: always()
        shell: bash
        env:
          RC_ACTION_OUTCOME: ${{ steps.note-action.outcome }}
          RC_EXIT_CODE: ${{ steps.note-action.outputs.exit-code }}
          RC_REPORT_PATH: ${{ steps.note-action.outputs.report-path }}
          RC_SUMMARY_PATH: ${{ steps.note-action.outputs.github-summary-path }}
        run: |
          test "$RC_ACTION_OUTCOME" = "failure"
          test "$RC_EXIT_CODE" = "1"
          test "$RC_REPORT_PATH" = "sample-project/.realitycheck/note-action/latest.html"
          test "$RC_SUMMARY_PATH" = "sample-project/.realitycheck/note-action/github-summary.md"
          test ! -d node_modules
          test -f downloaded-note-evidence/latest.html
          test -f downloaded-note-evidence/latest.json
          test -f downloaded-note-evidence/github-summary.md
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("downloaded-note-evidence")
          report = json.loads((root / "latest.json").read_text(encoding="utf-8"))
          assert report["kind"] == "html-note-check-bundle", report
          assert report["summary"]["status"] == "needs-fix", report
          assert report["sourceModified"] is False, report
          summary = (root / "github-summary.md").read_text(encoding="utf-8")
          assert "did not upload source notes" in summary, summary
          assert "bounded evidence excerpts" in summary, summary
          PY
