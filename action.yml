name: RealityCheck HTML note and browser quality gate
description: Check an HTML note folder or audit a running Web app, preserve evidence, and enforce a deterministic quality gate.
author: RealityCheck contributors

branding:
  icon: activity
  color: orange

inputs:
  kind:
    description: Target kind. Use web for a running application or note for a local HTML file/folder.
    required: false
    default: web
  path:
    description: HTML file or note folder, relative to working-directory. Required when kind is note.
    required: false
    default: ""
  url:
    description: Target URL. May be omitted when baseUrl exists in the project config.
    required: false
    default: ""
  config:
    description: Path to realitycheck.config.json, relative to working-directory.
    required: false
    default: ""
  mode:
    description: quick or deep.
    required: false
    default: quick
  fail-on:
    description: Gate threshold. Web accepts critical, major, minor, or never; note accepts error, warning, or never. Empty selects major for web and error for note.
    required: false
    default: ""
  baseline:
    description: Optional report.json used as a regression-only baseline. In note mode it must stay inside working-directory and be an earlier html-note-check-bundle.
    required: false
    default: ""
  output:
    description: Artifact directory, relative to working-directory. Empty selects .realitycheck/runs for web and .realitycheck/notes for note.
    required: false
    default: ""
  working-directory:
    description: Directory containing the target project.
    required: false
    default: .
  browser:
    description: Optional Chrome, Edge, or Chromium executable path.
    required: false
    default: ""
  max-files:
    description: Note mode only. Maximum HTML files to inspect, from 1 to 500.
    required: false
    default: "200"
  exclude-html:
    description: Note mode only. Optional newline-separated portable globs excluded from per-file rules; paths remain known package/cross-note targets, and a newly excluded baseline scope fails closed once.
    required: false
    default: ""
  allow-remote:
    description: Confirm authorization to test a public target.
    required: false
    default: "false"
  upload-artifact:
    description: Upload the complete local evidence directory even when the gate fails.
    required: false
    default: "true"
  artifact-name:
    description: GitHub Actions artifact name.
    required: false
    default: realitycheck-report
  attestation-private-key:
    description: Optional Ed25519 private key PEM supplied from a GitHub Secret; signs each completed evidence manifest.
    required: false
    default: ""
  attestation-trusted-key-id:
    description: Optional expected sha256 key ID; signing fails if the Secret resolves to another public key.
    required: false
    default: ""
  max-open-risk-age-days:
    description: Optional portfolio gate for the oldest open risk age in days.
    required: false
    default: ""
  max-open-risks:
    description: Optional portfolio gate for the total number of open risks.
    required: false
    default: ""
  max-recurring-risks:
    description: Optional portfolio gate for the total number of recurring risks.
    required: false
    default: ""
  trust-policy:
    description: Optional evidence-trust.json path, relative to working-directory, used to evaluate every manifest.
    required: false
    default: ""
  max-annotations:
    description: Maximum escaped GitHub workflow annotations emitted from the latest reports, from 1 to 50.
    required: false
    default: "20"
  summary-language:
    description: Language for the GitHub job summary and finding annotations (en or zh-CN).
    required: false
    default: en
  policy-before:
    description: Optional base-branch RealityCheck config snapshot used for structural policy review.
    required: false
    default: ""
  policy-after:
    description: Optional proposed RealityCheck config paired with policy-before; both are required together.
    required: false
    default: ""
  release-required-controls:
    description: Comma-separated release controls that must exist (audit, verification, policy, trust, risk, issues).
    required: false
    default: audit
  release-max-age-hours:
    description: Maximum age in hours for selected release evidence, from 1 to 8760.
    required: false
    default: "24"

outputs:
  audit-plan-path:
    description: Browser-free bilingual preview of the effective audit scope, detectors, governance, and execution ceiling.
    value: ${{ steps.plan.outputs.audit-plan-path }}
  plan-exit-code:
    description: Audit-plan preflight exit code (0 valid, 2 operational or configuration error).
    value: ${{ steps.plan.outputs.plan-exit-code }}
  exit-code:
    description: RealityCheck exit code (0 passed, 1 quality gate, 2 operational error).
    value: ${{ steps.result.outputs.exit-code }}
  report-root:
    description: Configured report root relative to the workspace.
    value: ${{ steps.result.outputs.report-root }}
  report-path:
    description: Stable bilingual HTML report path for the selected target kind.
    value: ${{ steps.result.outputs.report-path }}
  report-json-path:
    description: Stable machine-readable JSON report path for the selected target kind.
    value: ${{ steps.result.outputs.report-json-path }}
  note-report-path:
    description: Stable bilingual latest.html path when kind is note; empty in web mode.
    value: ${{ steps.note.outputs.report-path }}
  note-report-json-path:
    description: Stable latest.json path when kind is note; empty in web mode.
    value: ${{ steps.note.outputs.report-json-path }}
  note-comparison-path:
    description: Self-contained bilingual comparison.html when note baseline mode is active; empty otherwise.
    value: ${{ steps.note.outputs.comparison-path }}
  note-comparison-json-path:
    description: Machine-readable comparison.json when note baseline mode is active; empty otherwise.
    value: ${{ steps.note.outputs.comparison-json-path }}
  catalog-path:
    description: Portable HTML entry point for all evidence produced in the report root.
    value: ${{ steps.catalog.outputs.catalog-path }}
  issue-drafts-path:
    description: Local bilingual GitHub issue draft board generated from repair evidence; no issues are submitted automatically.
    value: ${{ steps.issues.outputs.issue-drafts-path }}
  risk-register-path:
    description: Portable HTML view of deduplicated risks across reports found in the report root.
    value: ${{ steps.risks.outputs.risk-register-path }}
  attestation-count:
    description: Number of evidence manifests signed with the configured Ed25519 key.
    value: ${{ steps.attest.outputs.attestation-count }}
  risk-exit-code:
    description: Longitudinal risk policy exit code (0 passed, 1 policy gate, 2 operational error).
    value: ${{ steps.risks.outputs.risk-exit-code }}
  trust-report-count:
    description: Number of evidence trust decision reports generated.
    value: ${{ steps.trust.outputs.trust-report-count }}
  trust-exit-code:
    description: Evidence trust decision exit code (0 trusted/not configured, 1 rejected, 2 operational error).
    value: ${{ steps.trust.outputs.trust-exit-code }}
  github-summary-path:
    description: Markdown job summary containing latest-target gates and prioritized findings.
    value: ${{ steps.result.outputs.github-summary-path }}
  summary-exit-code:
    description: Workflow-summary generation exit code (0 generated, 2 unavailable or invalid input).
    value: ${{ steps.result.outputs.summary-exit-code }}
  policy-review-path:
    description: Bilingual HTML policy-change review when policy-before and policy-after are configured.
    value: ${{ steps.policy.outputs.policy-review-path }}
  policy-exit-code:
    description: Policy review exit code (0 no weakening/not configured, 1 weakening blocked, 2 operational error).
    value: ${{ steps.policy.outputs.policy-exit-code }}
  release-decision-path:
    description: Bilingual HTML GO, REVIEW, or NO-GO decision assembled from selected release controls.
    value: ${{ steps.release.outputs.release-decision-path }}
  release-decision:
    description: Conservative release state (go, review, or no-go).
    value: ${{ steps.release.outputs.release-decision }}
  release-decision-exit-code:
    description: Release decision exit code (0 GO, 1 NO-GO, 2 operational error, 3 REVIEW).
    value: ${{ steps.release.outputs.release-decision-exit-code }}

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: "22"

    - name: Resolve target kind and defaults
      id: resolve
      shell: bash
      env:
        RC_KIND: ${{ inputs.kind }}
        RC_PATH: ${{ inputs.path }}
        RC_WORKDIR_INPUT: ${{ inputs.working-directory }}
        RC_FAIL_ON_INPUT: ${{ inputs.fail-on }}
        RC_OUTPUT_INPUT: ${{ inputs.output }}
        RC_BASELINE_INPUT: ${{ inputs.baseline }}
      run: |
        case "$RC_KIND" in
          web)
            fail_on="${RC_FAIL_ON_INPUT:-major}"
            output="${RC_OUTPUT_INPUT:-.realitycheck/runs}"
            case "$fail_on" in critical|major|minor|never) ;; *) echo "Web mode fail-on must be critical, major, minor, or never." >&2; exit 2 ;; esac
            ;;
          note)
            fail_on="${RC_FAIL_ON_INPUT:-error}"
            output="${RC_OUTPUT_INPUT:-.realitycheck/notes}"
            if [ -z "$RC_PATH" ]; then echo "Note mode requires path: with an HTML file or folder relative to working-directory." >&2; exit 2; fi
            case "$fail_on" in error|warning|never) ;; *) echo "Note mode fail-on must be error, warning, or never." >&2; exit 2 ;; esac
            ;;
          *)
            echo "RealityCheck kind must be web or note." >&2
            exit 2
            ;;
        esac
        node "$GITHUB_ACTION_PATH/realitycheck/scripts/action-paths.mjs" \
          --workspace "$GITHUB_WORKSPACE" \
          --working-directory "$RC_WORKDIR_INPUT" \
          --kind "$RC_KIND" \
          --path "$RC_PATH" \
          --baseline "$RC_BASELINE_INPUT" \
          --output "$output" \
          --github-output "$GITHUB_OUTPUT"
        echo "fail-on=$fail_on" >> "$GITHUB_OUTPUT"

    - name: Set up Python
      if: steps.resolve.outputs.kind == 'web'
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    - name: Install the pinned RealityCheck adapter
      if: steps.resolve.outputs.kind == 'web'
      shell: bash
      run: npm ci --omit=dev --ignore-scripts --prefix "$GITHUB_ACTION_PATH"

    - name: Run the browser-free HTML note check
      id: note
      if: steps.resolve.outputs.kind == 'note'
      shell: bash
      env:
        RC_PATH: ${{ steps.resolve.outputs.path }}
        RC_FAIL_ON: ${{ steps.resolve.outputs.fail-on }}
        RC_OUTPUT: ${{ steps.resolve.outputs.output }}
        RC_WORKDIR_ABS: ${{ steps.resolve.outputs.working-directory-absolute }}
        RC_REPORT_ROOT: ${{ steps.resolve.outputs.report-root }}
        RC_LANGUAGE: ${{ inputs.summary-language }}
        RC_MAX_FILES: ${{ inputs.max-files }}
        RC_BASELINE: ${{ steps.resolve.outputs.baseline }}
        RC_EXCLUDE_HTML: ${{ inputs.exclude-html }}
      run: |
        cd "$RC_WORKDIR_ABS"
        rm -f -- "$RC_OUTPUT/report.json" "$RC_OUTPUT/repair-plan.md" "$RC_OUTPUT/repair-plan.zh-CN.md" "$RC_OUTPUT/latest.html" "$RC_OUTPUT/latest.json" "$RC_OUTPUT/comparison.html" "$RC_OUTPUT/comparison.json" "$RC_OUTPUT/github-summary.md"
        args=("$RC_PATH" --output "$RC_OUTPUT" --fail-on "$RC_FAIL_ON" --language "$RC_LANGUAGE" --max-files "$RC_MAX_FILES")
        if [ -n "$RC_BASELINE" ]; then args+=(--baseline "$RC_BASELINE"); fi
        if [ -n "$RC_EXCLUDE_HTML" ]; then
          while IFS= read -r pattern || [ -n "$pattern" ]; do
            if [ -z "$pattern" ]; then
              echo "exclude-html contains an empty pattern; remove blank lines." >&2
              exit 2
            fi
            args+=(--exclude-html "$pattern")
          done < <(printf '%s' "$RC_EXCLUDE_HTML")
        fi
        set +e
        node "$GITHUB_ACTION_PATH/realitycheck/scripts/note-check.mjs" "${args[@]}"
        status=$?
        set -e
        case "$status" in 0|1|2) ;; *) echo "RealityCheck note command returned unexpected status $status; normalized to operational error 2." >&2; status=2 ;; esac
        echo "exit-code=$status" >> "$GITHUB_OUTPUT"
        echo "report-root=$RC_REPORT_ROOT" >> "$GITHUB_OUTPUT"
        if [ -f "$RC_OUTPUT/latest.html" ]; then
          echo "report-path=$RC_REPORT_ROOT/latest.html" >> "$GITHUB_OUTPUT"
          echo "report-json-path=$RC_REPORT_ROOT/latest.json" >> "$GITHUB_OUTPUT"
        fi
        if [ -f "$RC_OUTPUT/comparison.html" ] && [ -f "$RC_OUTPUT/comparison.json" ]; then
          echo "comparison-path=$RC_REPORT_ROOT/comparison.html" >> "$GITHUB_OUTPUT"
          echo "comparison-json-path=$RC_REPORT_ROOT/comparison.json" >> "$GITHUB_OUTPUT"
        fi

    - name: Publish the HTML note job summary
      id: note-summary
      if: always() && steps.resolve.outputs.kind == 'note' && (steps.note.outputs.exit-code == '0' || steps.note.outputs.exit-code == '1')
      shell: bash
      env:
        RC_OUTPUT: ${{ steps.resolve.outputs.output }}
        RC_WORKDIR_ABS: ${{ steps.resolve.outputs.working-directory-absolute }}
        RC_REPORT_ROOT: ${{ steps.resolve.outputs.report-root }}
        RC_SOURCE_ROOT: ${{ steps.resolve.outputs.source-root }}
        RC_LANGUAGE: ${{ inputs.summary-language }}
        RC_MAX_ANNOTATIONS: ${{ inputs.max-annotations }}
      run: |
        cd "$RC_WORKDIR_ABS"
        summary_path="$RC_OUTPUT/github-summary.md"
        annotation_log="$RUNNER_TEMP/realitycheck-note-annotations-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.log"
        set +e
        node "$GITHUB_ACTION_PATH/realitycheck/scripts/note-github-summary.mjs" "$RC_OUTPUT/latest.json" \
          --output "$summary_path" \
          --language "$RC_LANGUAGE" \
          --max-annotations "$RC_MAX_ANNOTATIONS" \
          --source-root "$RC_SOURCE_ROOT" > "$annotation_log"
        summary_status=$?
        set -e
        case "$summary_status" in 0|2) ;; *) echo "RealityCheck note summary returned unexpected status $summary_status; normalized to operational error 2." >&2; summary_status=2 ;; esac
        echo "summary-exit-code=$summary_status" >> "$GITHUB_OUTPUT"
        if [ "$summary_status" -eq 0 ]; then
          cat "$annotation_log"
          echo "github-summary-path=$RC_REPORT_ROOT/github-summary.md" >> "$GITHUB_OUTPUT"
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then cat "$summary_path" >> "$GITHUB_STEP_SUMMARY"; fi
        else
          cat "$annotation_log" >&2
          echo "RealityCheck could not build the HTML note job summary; any generated note report remains available." >&2
        fi

    - name: Preview the effective audit plan without a browser
      id: plan
      if: steps.resolve.outputs.kind == 'web'
      shell: bash
      env:
        RC_URL: ${{ inputs.url }}
        RC_CONFIG: ${{ inputs.config }}
        RC_MODE: ${{ inputs.mode }}
        RC_FAIL_ON: ${{ steps.resolve.outputs.fail-on }}
        RC_BASELINE: ${{ inputs.baseline }}
        RC_OUTPUT: ${{ steps.resolve.outputs.output }}
        RC_WORKDIR: ${{ inputs.working-directory }}
        RC_ALLOW_REMOTE: ${{ inputs.allow-remote }}
        RC_SUMMARY_LANGUAGE: ${{ inputs.summary-language }}
      run: |
        cd "$GITHUB_WORKSPACE/$RC_WORKDIR"
        plan_dir="$RC_OUTPUT/audit-plan"
        args=(plan)
        if [ -n "$RC_URL" ]; then args+=("$RC_URL"); fi
        if [ -n "$RC_CONFIG" ]; then args+=(--config "$RC_CONFIG"); fi
        args+=(--mode "$RC_MODE" --fail-on "$RC_FAIL_ON" --output "$plan_dir")
        if [ -n "$RC_BASELINE" ]; then args+=(--baseline "$RC_BASELINE"); fi
        if [ "$RC_ALLOW_REMOTE" = "true" ]; then args+=(--allow-remote); fi
        set +e
        node "$GITHUB_ACTION_PATH/realitycheck/scripts/audit.mjs" "${args[@]}"
        plan_status=$?
        set -e
        echo "plan-exit-code=$plan_status" >> "$GITHUB_OUTPUT"
        if [ "$plan_status" -eq 0 ]; then
          echo "audit-plan-path=$RC_WORKDIR/$plan_dir/audit-plan.html" >> "$GITHUB_OUTPUT"
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            if [ "$RC_SUMMARY_LANGUAGE" = "zh-CN" ]; then
              cat "$plan_dir/audit-plan.zh-CN.md" >> "$GITHUB_STEP_SUMMARY"
            else
              cat "$plan_dir/audit-plan.md" >> "$GITHUB_STEP_SUMMARY"
            fi
            printf '\n' >> "$GITHUB_STEP_SUMMARY"
          fi
        else
          echo "RealityCheck could not validate the effective audit plan; the browser audit will still preserve diagnostic evidence." >&2
        fi

    - name: Run browser audit
      id: audit
      if: steps.resolve.outputs.kind == 'web'
      shell: bash
      env:
        RC_URL: ${{ inputs.url }}
        RC_CONFIG: ${{ inputs.config }}
        RC_MODE: ${{ inputs.mode }}
        RC_FAIL_ON: ${{ steps.resolve.outputs.fail-on }}
        RC_BASELINE: ${{ inputs.baseline }}
        RC_OUTPUT: ${{ steps.resolve.outputs.output }}
        RC_WORKDIR: ${{ inputs.working-directory }}
        RC_BROWSER: ${{ inputs.browser }}
        RC_ALLOW_REMOTE: ${{ inputs.allow-remote }}
      run: |
        cd "$GITHUB_WORKSPACE/$RC_WORKDIR"
        args=(audit)
        if [ -n "$RC_URL" ]; then args+=("$RC_URL"); fi
        if [ -n "$RC_CONFIG" ]; then args+=(--config "$RC_CONFIG"); fi
        args+=(--mode "$RC_MODE" --fail-on "$RC_FAIL_ON" --output "$RC_OUTPUT")
        if [ -n "$RC_BASELINE" ]; then args+=(--baseline "$RC_BASELINE"); fi
        if [ -n "$RC_BROWSER" ]; then args+=(--browser "$RC_BROWSER"); fi
        if [ "$RC_ALLOW_REMOTE" = "true" ]; then args+=(--allow-remote); fi
        set +e
        node "$GITHUB_ACTION_PATH/realitycheck/scripts/audit.mjs" "${args[@]}"
        status=$?
        set -e
        echo "exit-code=$status" >> "$GITHUB_OUTPUT"
        echo "report-root=$RC_WORKDIR/$RC_OUTPUT" >> "$GITHUB_OUTPUT"

    - name: Publish bounded workflow annotations
      id: summary
      if: always() && steps.resolve.outputs.kind == 'web'
      shell: bash
      env:
        RC_OUTPUT: ${{ steps.resolve.outputs.output }}
        RC_WORKDIR: ${{ inputs.working-directory }}
        RC_MAX_ANNOTATIONS: ${{ inputs.max-annotations }}
        RC_SUMMARY_LANGUAGE: ${{ inputs.summary-language }}
      run: |
        cd "$GITHUB_WORKSPACE/$RC_WORKDIR"
        summary_path="$RC_OUTPUT/github-summary.md"
        annotation_log="$RUNNER_TEMP/realitycheck-annotations-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.log"
        set +e
        node "$GITHUB_ACTION_PATH/realitycheck/scripts/audit.mjs" github-summary "$RC_OUTPUT" \
          --output "$summary_path" \
          --max-annotations "$RC_MAX_ANNOTATIONS" \
          --language "$RC_SUMMARY_LANGUAGE" > "$annotation_log"
        summary_status=$?
        set -e
        echo "summary-exit-code=$summary_status" >> "$GITHUB_OUTPUT"
        if [ "$summary_status" -eq 0 ]; then
          cat "$annotation_log"
          echo "github-summary-path=$RC_WORKDIR/$summary_path" >> "$GITHUB_OUTPUT"
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then cat "$summary_path" >> "$GITHUB_STEP_SUMMARY"; fi
        else
          cat "$annotation_log" >&2
          echo "RealityCheck could not build trusted workflow annotations; the primary audit result remains authoritative." >&2
        fi

    - name: Review project policy changes
      id: policy
      if: always() && steps.resolve.outputs.kind == 'web'
      shell: bash
      env:
        RC_POLICY_BEFORE: ${{ inputs.policy-before }}
        RC_POLICY_AFTER: ${{ inputs.policy-after }}
        RC_OUTPUT: ${{ steps.resolve.outputs.output }}
        RC_WORKDIR: ${{ inputs.working-directory }}
        RC_SUMMARY_LANGUAGE: ${{ inputs.summary-language }}
      run: |
        if [ -z "$RC_POLICY_BEFORE" ] && [ -z "$RC_POLICY_AFTER" ]; then
          echo "policy-exit-code=0" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        if [ -z "$RC_POLICY_BEFORE" ] || [ -z "$RC_POLICY_AFTER" ]; then
          echo "policy-exit-code=2" >> "$GITHUB_OUTPUT"
          echo "policy-before and policy-after must be configured together." >&2
          exit 0
        fi
        cd "$GITHUB_WORKSPACE/$RC_WORKDIR"
        policy_dir="$RC_OUTPUT/policy-review"
        set +e
        node "$GITHUB_ACTION_PATH/realitycheck/scripts/audit.mjs" policy-review \
          "$RC_POLICY_BEFORE" "$RC_POLICY_AFTER" --output "$policy_dir"
        policy_status=$?
        set -e
        echo "policy-exit-code=$policy_status" >> "$GITHUB_OUTPUT"
        if [ "$policy_status" -le 1 ]; then
          echo "policy-review-path=$RC_WORKDIR/$policy_dir/policy-review.html" >> "$GITHUB_OUTPUT"
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            printf '\n' >> "$GITHUB_STEP_SUMMARY"
            if [ "$RC_SUMMARY_LANGUAGE" = "zh-CN" ]; then
              cat "$policy_dir/policy-review.zh-CN.md" >> "$GITHUB_STEP_SUMMARY"
            else
              cat "$policy_dir/policy-review.md" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
        fi

    - name: Sign completed evidence manifests
      id: attest
      if: always() && steps.resolve.outputs.kind == 'web'
      shell: bash
      env:
        RC_ATTESTATION_PRIVATE_KEY: ${{ inputs.attestation-private-key }}
        RC_ATTESTATION_TRUSTED_KEY_ID: ${{ inputs.attestation-trusted-key-id }}
        RC_OUTPUT: ${{ steps.resolve.outputs.output }}
        RC_WORKDIR: ${{ inputs.working-directory }}
      run: |
        if [ -z "$RC_ATTESTATION_PRIVATE_KEY" ]; then
          echo "attestation-count=0" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        cd "$GITHUB_WORKSPACE/$RC_WORKDIR"
        key_file="$RUNNER_TEMP/realitycheck-attestation-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.pem"
        umask 077
        printf '%s' "$RC_ATTESTATION_PRIVATE_KEY" > "$key_file"
        trap 'rm -f -- "$key_file"' EXIT
        count=0
        status=0
        while IFS= read -r -d '' manifest; do
          args=(attest "$manifest" --private-key "$key_file")
          if [ -n "$RC_ATTESTATION_TRUSTED_KEY_ID" ]; then args+=(--trusted-key "$RC_ATTESTATION_TRUSTED_KEY_ID"); fi
          if node "$GITHUB_ACTION_PATH/realitycheck/scripts/audit.mjs" "${args[@]}"; then
            count=$((count + 1))
          else
            status=2
          fi
        done < <(find "$RC_OUTPUT" -type f -name evidence-manifest.json -print0)
        echo "attestation-count=$count" >> "$GITHUB_OUTPUT"
        exit "$status"

    - name: Evaluate evidence trust
      id: trust
      if: always() && steps.resolve.outputs.kind == 'web'
      shell: bash
      env:
        RC_TRUST_POLICY: ${{ inputs.trust-policy }}
        RC_OUTPUT: ${{ steps.resolve.outputs.output }}
        RC_WORKDIR: ${{ inputs.working-directory }}
      run: |
        if [ -z "$RC_TRUST_POLICY" ]; then
          echo "trust-report-count=0" >> "$GITHUB_OUTPUT"
          echo "trust-exit-code=0" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        cd "$GITHUB_WORKSPACE/$RC_WORKDIR"
        count=0
        status=0
        while IFS= read -r -d '' manifest; do
          set +e
          node "$GITHUB_ACTION_PATH/realitycheck/scripts/audit.mjs" trust-report "$manifest" --trust-policy "$RC_TRUST_POLICY"
          decision_status=$?
          set -e
          if [ "$decision_status" -le 1 ]; then count=$((count + 1)); fi
          if [ "$decision_status" -gt "$status" ]; then status=$decision_status; fi
        done < <(find "$RC_OUTPUT" -type f -name evidence-manifest.json -print0)
        echo "trust-report-count=$count" >> "$GITHUB_OUTPUT"
        echo "trust-exit-code=$status" >> "$GITHUB_OUTPUT"

    - name: Build reviewable GitHub issue drafts
      id: issues
      if: always() && steps.resolve.outputs.kind == 'web'
      shell: bash
      env:
        RC_OUTPUT: ${{ steps.resolve.outputs.output }}
        RC_WORKDIR: ${{ inputs.working-directory }}
      run: |
        cd "$GITHUB_WORKSPACE/$RC_WORKDIR"
        issue_dir="$RC_OUTPUT/issue-drafts"
        set +e
        node "$GITHUB_ACTION_PATH/realitycheck/scripts/audit.mjs" issue-drafts \
          "$RC_OUTPUT" --output "$issue_dir"
        issue_status=$?
        set -e
        if [ "$issue_status" -eq 0 ]; then
          echo "issue-drafts-path=$RC_WORKDIR/$issue_dir/github-issue-drafts.html" >> "$GITHUB_OUTPUT"
        else
          echo "No valid repair plan was available for GitHub issue drafts." >&2
        fi

    - name: Build the longitudinal risk register
      id: risks
      if: always() && steps.resolve.outputs.kind == 'web'
      shell: bash
      env:
        RC_OUTPUT: ${{ steps.resolve.outputs.output }}
        RC_WORKDIR: ${{ inputs.working-directory }}
        RC_MAX_OPEN_RISK_AGE_DAYS: ${{ inputs.max-open-risk-age-days }}
        RC_MAX_OPEN_RISKS: ${{ inputs.max-open-risks }}
        RC_MAX_RECURRING_RISKS: ${{ inputs.max-recurring-risks }}
      run: |
        cd "$GITHUB_WORKSPACE/$RC_WORKDIR"
        risk_dir="$RC_OUTPUT/risk-register"
        args=(risk-register "$RC_OUTPUT" --output "$risk_dir")
        if [ -n "$RC_MAX_OPEN_RISK_AGE_DAYS" ]; then args+=(--max-open-age-days "$RC_MAX_OPEN_RISK_AGE_DAYS"); fi
        if [ -n "$RC_MAX_OPEN_RISKS" ]; then args+=(--max-open-risks "$RC_MAX_OPEN_RISKS"); fi
        if [ -n "$RC_MAX_RECURRING_RISKS" ]; then args+=(--max-recurring-risks "$RC_MAX_RECURRING_RISKS"); fi
        set +e
        node "$GITHUB_ACTION_PATH/realitycheck/scripts/audit.mjs" "${args[@]}"
        risk_status=$?
        set -e
        echo "risk-exit-code=$risk_status" >> "$GITHUB_OUTPUT"
        if [ "$risk_status" -le 1 ]; then
          echo "risk-register-path=$RC_WORKDIR/$risk_dir/risk-register.html" >> "$GITHUB_OUTPUT"
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            printf '\n## RealityCheck longitudinal risk register\n\n' >> "$GITHUB_STEP_SUMMARY"
            cat "$risk_dir/risk-register.md" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$risk_status" -eq 1 ]; then echo "RealityCheck longitudinal risk policy failed; evidence was preserved."; fi
        else
          echo "No valid RealityCheck page reports were available for a risk register." >&2
        fi

    - name: Assemble the release decision
      id: release
      if: always() && steps.resolve.outputs.kind == 'web'
      shell: bash
      env:
        RC_OUTPUT: ${{ steps.resolve.outputs.output }}
        RC_WORKDIR: ${{ inputs.working-directory }}
        RC_RELEASE_REQUIRED: ${{ inputs.release-required-controls }}
        RC_RELEASE_MAX_AGE_HOURS: ${{ inputs.release-max-age-hours }}
        RC_SUMMARY_LANGUAGE: ${{ inputs.summary-language }}
      run: |
        cd "$GITHUB_WORKSPACE/$RC_WORKDIR"
        release_dir="$RC_OUTPUT/release-decision"
        set +e
        node "$GITHUB_ACTION_PATH/realitycheck/scripts/audit.mjs" release-decision "$RC_OUTPUT" \
          --require "$RC_RELEASE_REQUIRED" \
          --max-age-hours "$RC_RELEASE_MAX_AGE_HOURS" \
          --output "$release_dir"
        release_status=$?
        set -e
        echo "release-decision-exit-code=$release_status" >> "$GITHUB_OUTPUT"
        if [ "$release_status" -eq 0 ] || [ "$release_status" -eq 1 ] || [ "$release_status" -eq 3 ]; then
          decision="$(node -e 'const fs=require("node:fs");const value=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));process.stdout.write(value.decision)' "$release_dir/release-decision.json")"
          echo "release-decision=$decision" >> "$GITHUB_OUTPUT"
          echo "release-decision-path=$RC_WORKDIR/$release_dir/release-decision.html" >> "$GITHUB_OUTPUT"
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            printf '\n' >> "$GITHUB_STEP_SUMMARY"
            if [ "$RC_SUMMARY_LANGUAGE" = "zh-CN" ]; then
              cat "$release_dir/release-decision.zh-CN.md" >> "$GITHUB_STEP_SUMMARY"
            else
              cat "$release_dir/release-decision.md" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
        else
          echo "RealityCheck could not assemble a valid release decision." >&2
        fi

    - name: Build the evidence catalog
      id: catalog
      if: always() && steps.resolve.outputs.kind == 'web'
      shell: bash
      env:
        RC_OUTPUT: ${{ steps.resolve.outputs.output }}
        RC_WORKDIR: ${{ inputs.working-directory }}
      run: |
        cd "$GITHUB_WORKSPACE/$RC_WORKDIR"
        catalog_dir="$RC_OUTPUT/catalog"
        set +e
        node "$GITHUB_ACTION_PATH/realitycheck/scripts/audit.mjs" catalog "$RC_OUTPUT" --output "$catalog_dir"
        catalog_status=$?
        set -e
        if [ "$catalog_status" -eq 0 ]; then
          echo "catalog-path=$RC_WORKDIR/$catalog_dir/catalog.html" >> "$GITHUB_OUTPUT"
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            printf '\n## RealityCheck evidence catalog\n\n' >> "$GITHUB_STEP_SUMMARY"
            cat "$catalog_dir/catalog.md" >> "$GITHUB_STEP_SUMMARY"
          fi
        else
          echo "No valid RealityCheck evidence was available for a catalog." >&2
        fi

    - name: Upload RealityCheck evidence
      if: always() && steps.resolve.outcome == 'success' && inputs.upload-artifact == 'true' && (steps.resolve.outputs.kind == 'web' || steps.note.outputs.exit-code == '0' || steps.note.outputs.exit-code == '1')
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ steps.resolve.outputs.artifact-path }}
        if-no-files-found: error

    - name: Enforce the RealityCheck result
      id: result
      if: always()
      shell: bash
      env:
        RC_KIND: ${{ steps.resolve.outputs.kind }}
        RC_OUTPUT: ${{ steps.resolve.outputs.output }}
        RC_REPORT_ROOT: ${{ steps.resolve.outputs.report-root }}
        RC_ARTIFACT_PATH: ${{ steps.resolve.outputs.artifact-path }}
        RC_NOTE_EXIT_CODE: ${{ steps.note.outputs.exit-code }}
        RC_NOTE_SUMMARY_EXIT_CODE: ${{ steps.note-summary.outputs.summary-exit-code }}
        RC_NOTE_REPORT_PATH: ${{ steps.note.outputs.report-path }}
        RC_NOTE_REPORT_JSON_PATH: ${{ steps.note.outputs.report-json-path }}
        RC_NOTE_SUMMARY_PATH: ${{ steps.note-summary.outputs.github-summary-path }}
        RC_WEB_SUMMARY_PATH: ${{ steps.summary.outputs.github-summary-path }}
        RC_PLAN_EXIT_CODE: ${{ steps.plan.outputs.plan-exit-code }}
        RC_EXIT_CODE: ${{ steps.audit.outputs.exit-code }}
        RC_SUMMARY_EXIT_CODE: ${{ steps.summary.outputs.summary-exit-code }}
        RC_ATTESTATION_OUTCOME: ${{ steps.attest.outcome }}
        RC_RISK_EXIT_CODE: ${{ steps.risks.outputs.risk-exit-code }}
        RC_TRUST_EXIT_CODE: ${{ steps.trust.outputs.trust-exit-code }}
        RC_POLICY_EXIT_CODE: ${{ steps.policy.outputs.policy-exit-code }}
        RC_RELEASE_EXIT_CODE: ${{ steps.release.outputs.release-decision-exit-code }}
      run: |
        if [ -z "$RC_KIND" ]; then
          echo "exit-code=2" >> "$GITHUB_OUTPUT"
          echo "summary-exit-code=2" >> "$GITHUB_OUTPUT"
          echo "RealityCheck target-kind preflight failed."
          exit 2
        fi
        echo "report-root=$RC_REPORT_ROOT" >> "$GITHUB_OUTPUT"
        if [ "$RC_KIND" = "note" ]; then
          note_status="${RC_NOTE_EXIT_CODE:-2}"
          summary_status="${RC_NOTE_SUMMARY_EXIT_CODE:-2}"
          case "$note_status" in 0|1|2) ;; *) echo "RealityCheck HTML note check returned an invalid status; normalized to 2." >&2; note_status=2 ;; esac
          case "$summary_status" in 0|2) ;; *) echo "RealityCheck HTML note summary returned an invalid status; normalized to 2." >&2; summary_status=2 ;; esac
          if [ "$note_status" = "2" ]; then summary_status=2; fi
          if { [ "$note_status" = "0" ] || [ "$note_status" = "1" ]; } && [ "$summary_status" != "0" ]; then
            echo "RealityCheck HTML note summary generation failed."
            note_status=2
            summary_status=2
          fi
          echo "exit-code=$note_status" >> "$GITHUB_OUTPUT"
          echo "summary-exit-code=$summary_status" >> "$GITHUB_OUTPUT"
          if [ -n "$RC_NOTE_REPORT_PATH" ]; then echo "report-path=$RC_NOTE_REPORT_PATH" >> "$GITHUB_OUTPUT"; fi
          if [ -n "$RC_NOTE_REPORT_JSON_PATH" ]; then echo "report-json-path=$RC_NOTE_REPORT_JSON_PATH" >> "$GITHUB_OUTPUT"; fi
          if [ -n "$RC_NOTE_SUMMARY_PATH" ]; then echo "github-summary-path=$RC_NOTE_SUMMARY_PATH" >> "$GITHUB_OUTPUT"; fi
          if [ "$note_status" = "1" ]; then
            echo "RealityCheck HTML note gate failed. Download the uploaded evidence and open latest.html for exact findings."
          elif [ "$note_status" = "2" ]; then
            echo "RealityCheck could not check the HTML note. Review the input path and note-check diagnostics."
          fi
          exit "$note_status"
        fi
        web_status="${RC_EXIT_CODE:-2}"
        web_summary_status="${RC_SUMMARY_EXIT_CODE:-2}"
        case "$web_status" in 0|1|2) ;; *) echo "RealityCheck Web audit returned an invalid status; normalized to 2." >&2; web_status=2 ;; esac
        case "$web_summary_status" in 0|2) ;; *) echo "RealityCheck Web summary returned an invalid status; normalized to 2." >&2; web_summary_status=2 ;; esac
        echo "exit-code=$web_status" >> "$GITHUB_OUTPUT"
        echo "summary-exit-code=$web_summary_status" >> "$GITHUB_OUTPUT"
        if [ -f "$RC_ARTIFACT_PATH/latest.html" ]; then
          echo "report-path=$RC_REPORT_ROOT/latest.html" >> "$GITHUB_OUTPUT"
        fi
        if [ -f "$RC_ARTIFACT_PATH/latest.json" ]; then
          echo "report-json-path=$RC_REPORT_ROOT/latest.json" >> "$GITHUB_OUTPUT"
        fi
        if [ -n "$RC_WEB_SUMMARY_PATH" ]; then echo "github-summary-path=$RC_WEB_SUMMARY_PATH" >> "$GITHUB_OUTPUT"; fi
        if [ "$RC_PLAN_EXIT_CODE" != "0" ]; then
          echo "RealityCheck could not validate the browser-free audit plan. Inspect the configuration diagnostics."
          exit 2
        fi
        if [ "$RC_ATTESTATION_OUTCOME" = "failure" ]; then
          echo "RealityCheck evidence signing failed. Check that the configured Secret is a valid Ed25519 private key."
          exit 2
        fi
        if [ "$web_summary_status" != "0" ]; then
          echo "RealityCheck workflow annotation generation failed."
          exit 2
        fi
        if [ "$RC_RISK_EXIT_CODE" = "2" ]; then
          echo "RealityCheck could not build the longitudinal risk register."
          exit 2
        fi
        if [ "$RC_TRUST_EXIT_CODE" = "2" ]; then
          echo "RealityCheck could not evaluate the configured evidence trust policy."
          exit 2
        fi
        if [ "$RC_POLICY_EXIT_CODE" = "2" ]; then
          echo "RealityCheck could not complete the configured policy review."
          exit 2
        fi
        if [ "$RC_RELEASE_EXIT_CODE" = "2" ]; then
          echo "RealityCheck could not assemble the configured release decision."
          exit 2
        fi
        if [ "$web_status" -eq 1 ]; then
          echo "RealityCheck quality gate failed. Download the uploaded evidence report for exact findings."
        elif [ "$web_status" -eq 2 ]; then
          echo "RealityCheck could not complete. Review the audit log and environment doctor output."
        fi
        if [ "$RC_TRUST_EXIT_CODE" = "1" ]; then echo "RealityCheck evidence trust policy rejected one or more bundles."; fi
        if [ "$RC_POLICY_EXIT_CODE" = "1" ]; then echo "RealityCheck blocked one or more structural policy weakenings."; fi
        if [ "$RC_RELEASE_EXIT_CODE" = "3" ]; then echo "RealityCheck release evidence requires human review; inspect the decision artifact."; fi
        if [ "$web_status" -eq 1 ] || [ "$RC_RISK_EXIT_CODE" = "1" ] || [ "$RC_TRUST_EXIT_CODE" = "1" ] || [ "$RC_POLICY_EXIT_CODE" = "1" ] || [ "$RC_RELEASE_EXIT_CODE" = "1" ]; then exit 1; fi
        exit "$web_status"
