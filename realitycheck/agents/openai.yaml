interface:
  display_name: "RealityCheck"
  short_description: "Check, repair, publish, and live-verify HTML"
  icon_small: "./assets/icon.svg"
  icon_large: "./assets/logo.svg"
  brand_color: "#FF5C35"
  default_prompt: "Use $realitycheck to check this HTML note or Web app, repair a separate copy when requested, and verify its publish package or authorized live URL with explicit evidence."

policy:
  allow_implicit_invocation: true
