interface:
  display_name: "RealityCheck"
  short_description: "Check and repair HTML notes; prove Web UI failures"
  icon_small: "./assets/icon.svg"
  icon_large: "./assets/logo.svg"
  brand_color: "#FF5C35"
  default_prompt: "Use $realitycheck to check this HTML note or Web app, explain the evidence, and when I request repair create and verify a separate usable copy without overwriting the source."

policy:
  allow_implicit_invocation: true
