interface:
  display_name: "RealityCheck"
  short_description: "Check HTML notes and Web apps with local evidence"
  icon_small: "./assets/icon.svg"
  icon_large: "./assets/logo.svg"
  brand_color: "#FF5C35"
  default_prompt: "Use $realitycheck to check this HTML note or Web app, explain the evidence clearly, and prepare safe, reviewable fixes."

policy:
  allow_implicit_invocation: true
