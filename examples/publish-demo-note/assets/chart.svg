      <g transform="translate(552)"><rect width="164" height="154" rx="14" fill="#2c6d59"/><text x="18" y="40" fill="#bfe8da" font-size="12">OFFLINE REPLAY</text><text x="18" y="104" fill="#fff" font-size="28" font-weight="800">PASS</text></g>
