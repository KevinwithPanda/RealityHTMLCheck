<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>Security Policy Lab · RealityCheck</title>
  <style>
    :root { font-family: Inter, ui-sans-serif, system-ui, sans-serif; color: #1e293b; background: #f1f5f9; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { width: min(720px, calc(100% - 32px)); margin: 0 auto; padding: 64px 0; }
    .eyebrow { color: #c2410c; font-size: 12px; font-weight: 850; letter-spacing: .1em; text-transform: uppercase; }
    h1 { margin: 8px 0 12px; font-size: clamp(36px, 8vw, 64px); letter-spacing: -.055em; }
    .lede { color: #64748b; line-height: 1.7; }
    form { display: grid; gap: 16px; margin-top: 32px; padding: 26px; border: 1px solid #dbe3ec; border-radius: 18px; background: #fff; box-shadow: 0 18px 50px rgb(15 23 42 / 8%); }
    label { display: grid; gap: 7px; font-weight: 750; }
    input { min-height: 44px; border: 1px solid #b9c4d2; border-radius: 9px; padding: 9px 11px; font: inherit; }
    button { min-height: 44px; border: 0; border-radius: 9px; color: #fff; background: #c2410c; font: inherit; font-weight: 800; }
    .warning { color: #9a3412; font-size: 13px; }
  </style>
</head>
<body><main><p class="eyebrow">Intentional policy failures</p><h1>Security baseline lab</h1><p class="lede">This local fixture is served without project-required response headers. Its password form deliberately uses GET so RealityCheck can prove the secure-form policy without submitting it.</p>
  <form method="get" action="index.html"><label>Operator email<input type="email" name="email" autocomplete="username"></label><label>Password<input type="password" name="password" autocomplete="current-password"></label><button type="submit">Sign in</button><span class="warning">Fixture only: the auditor must never submit this form.</span></form>
</main></body></html>
