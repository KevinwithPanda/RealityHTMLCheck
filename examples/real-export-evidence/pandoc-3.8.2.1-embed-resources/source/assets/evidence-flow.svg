  <desc id="desc">Three connected stages labelled collect, verify, and share.</desc>
  <rect width="720" height="180" rx="24" fill="#f7f2ec"/>
  <g fill="#ffffff" stroke="#c84f30" stroke-width="3">
    <rect x="45" y="50" width="170" height="80" rx="14"/>
    <rect x="275" y="50" width="170" height="80" rx="14"/>
    <rect x="505" y="50" width="170" height="80" rx="14"/>
  </g>
  <g fill="#27303d" font-family="system-ui, sans-serif" font-size="24" font-weight="700" text-anchor="middle">
